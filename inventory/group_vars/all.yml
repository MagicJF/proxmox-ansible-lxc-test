# ============================================================================
# Desired state of every guest this repository manages.
#
# This is the only file that changes when a change is requested: edit it, open a
# branch, run preflight -> apply. The playbooks under playbooks/ are a fixed
# engine (two verbs) and never grow one file per request.
#
# It is a group_vars FILE for the group "all", so variables sit at the top level.
# Nesting them under an "all:" key would define one variable named "all" and
# leave every real variable undefined.
#
# Everything the provisioning module can set is declared here, including the
# settings that must NOT exist (null / empty): absence is state too, so the
# engine deletes anything that appears where the file declares nothing.
# ============================================================================

pve_node: Proxmox

# ============================================================================
# The automation key every guest is born with — a framework default, not a
# per-guest decision.
#
# PVE's LXC `pubkey` parameter writes this public key into the guest's
# /root/.ssh/authorized_keys AT CREATION. It is a birth-time property: the
# module never forwards it on update, so layer 1 can set it and cannot re-read
# it afterwards, and layer 2 (configure/) is what verifies it from the inside.
#
# The single source of truth is the key FILE, not a copy of its text:
#   pve_ssh_pubkey_path -> the .pub next to the private key used by configure/
# If the file is absent the lookup yields nothing and no key is injected, so a
# clone of this repository without the key still runs (it just has no SSH
# automation until the path is provided).
#
# Opting a single guest out is explicit: declare `pubkey: ""` on that guest.
# ============================================================================
pve_ssh_pubkey_path: "/home/hermes/.hermes/profiles/hermione/secrets/pve-automation_ed25519.pub"

pve_defaults:
  # ---- creation-time: PVE cannot change these on an existing container ------
  # Drift here is refused, not converged: the container would have to be
  # recreated (and rootfs growth cannot be undone at all).
  template: "local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst"
  template_storage: local
  storage: local-zfs
  rootfs_size: 8
  unprivileged: true
  ostype: debian

  # ---- power state ---------------------------------------------------------
  # started | stopped
  status: stopped

  # ---- resources (converged in place) -------------------------------------
  memory: 2048
  swap: 512
  cores: 2
  # cpuunits only: the module's `cpus` parameter means cpuunits on creation but
  # cpulimit on update, so it cannot be declared coherently. Use cpuunits.
  cpuunits: 1024

  # ---- behaviour (converged in place) -------------------------------------
  onboot: false
  description: "Managed by proxmox-ansible-lxc-test. Declare changes in inventory/group_vars/all.yml."
  tags: [ansible-managed, lab]
  # PVE accepts the literal "host" to follow the node's timezone.
  timezone: host
  # tty | console | shell
  cmode: shell
  # List form, joined by the module. Empty list = must not exist.
  features: []
  startup: []

  # ---- network (converged in place; empty = no interface at all) ----------
  netif: {}
  nameserver: null
  searchdomain: null

  # ---- attachments (converged in place; empty = must not exist) -----------
  hookscript: null
  mounts: {}
  mount_devices: []

  # ---- the key at birth (see pve_ssh_pubkey_path above) --------------------
  pubkey: "{{ lookup('file', pve_ssh_pubkey_path, errors='ignore') | default('', true) | trim }}"
  # password: creation-time secret, which would have to live in Git — not
  #           declared; inject it from a vault at creation time if ever needed.
  # clone / clone_type: alternative creation path, unused here.
  # pool: no pool exists on this node.
  # force / purge / destroy_unreferenced_disks: destructive control flags, never
  #           automated by the engine.

# The containers this repository manages — and nothing else. A container absent
# from this list is never read, created or modified.
# vmid + hostname are identity; changing them means "recreate".
# Any key of pve_defaults may be overridden per container.
pve_containers:
  # Observability test container: every attribute below is randomly generated
  # and overrides the defaults. It also proves the key-at-birth default: it was
  # created by this engine, so it has /root/.ssh/authorized_keys already.
  - vmid: 167
    hostname: ct-forge-5f2a
    rootfs_size: 7
    cores: 5
    memory: 2560
    swap: 896
    cpuunits: 512
    onboot: true
    status: started
    cmode: tty
    timezone: host
    tags: [canary, lab, tier1]
    description: "Generated by the observability test at 2026-11-04; every attribute below is random."
    features: []
    startup: []
    nameserver: 9.9.9.9
    searchdomain: null
    netif:
      net0: "name=eth0,bridge=vmbr0,ip=dhcp"
    mounts:
      mp0: "local:5,mp=/mnt/data"

  # TiddlyWiki service. Layer 1 owns the guest's shape; layer 2 owns the wiki,
  # its dependencies and the unit that serves it on every boot.
  - vmid: 131
    hostname: wiki-tiddly
    cores: 1
    memory: 1024
    rootfs_size: 6
    swap: 512
    status: started
    tags: [wiki, lab]
    description: "TiddlyWiki server: shape owned by layer 1, the wiki and its service owned by layer 2."
    netif:
      # Static on the LAN bridge: layer 2 derives the SSH target from here, and a
      # DHCP-only guest cannot be reached (nor can its URL be declared once).
      net0: "name=eth0,bridge=vmbr1,gw=10.10.10.1,ip=10.10.10.31/24,ip6=auto"

    # ---- layer 2 (configure/). Layer 1 ignores the `config` block. -----------
    manage: true
    config:
      tiddlywiki:
        wiki_dir: /srv/tiddlywiki
        port: 8080
        # Pinned on purpose: a rebuild must install the same wiki engine. This is
        # the version published as `latest` on npm when the guest was declared.
        version: "5.4.1"
        service_user: tiddlywiki
        # Where it binds. 0.0.0.0 makes it reachable from the LAN (the point of
        # serving it) — a TiddlyWiki server edition is writable and
        # unauthenticated, so this is an explicit exposure decision and the guest
        # must stay on a network that is not public.
        listen_host: "0.0.0.0"
      # Proof from OUTSIDE the guest, asserted after convergence: the declaration
      # says which status and body the URL must answer.
      http:
        - address: ":8080"
          expect_status: 200
          expect_body: "TiddlyWiki"

  # Apache web server. Layer 1 owns the guest's shape; layer 2 owns Apache, the
  # vhosts and the content they serve.
  - vmid: 132
    hostname: web-apache
    cores: 1
    memory: 512
    swap: 512
    rootfs_size: 4
    status: started
    tags: [web, apache, lab]
    description: "Apache web server: shape owned by layer 1, Apache and its declared vhosts owned by layer 2."
    netif:
      # Static on the LAN bridge, like the wiki guest: layer 2 derives the SSH
      # target from here (pve_declared_ipv4) and the HTTP probe needs an address
      # it can name once.
      # NOT vmbr0: that is the public uplink (54.36.168.83/24 on eno3) and would
      # expose an unauthenticated web server to the internet. A container NIC is
      # creation-time, so getting this wrong means recreating the guest.
      net0: "name=eth0,bridge=vmbr1,gw=10.10.10.1,ip=10.10.10.32/24,ip6=auto"
    # nameserver stays at the default (null = inherit the host's resolv.conf):
    # that is the path already proven to reach the Debian mirrors from this LAN,
    # and installing Apache needs exactly that.

    # ---- layer 2 (configure/). Layer 1 ignores the `config` block. -----------
    manage: true
    config:
      apache:
        # One vhost per declared entry. `port` is explicit because the role
        # renders /etc/apache2/ports.conf FROM these values: exposure is an
        # exposure decision that belongs in the manifest.
        sites:
          - name: lab-web
            port: 80
            root: /srv/www/lab-web
            index_html: |
              <!doctype html>
              <html lang="es">
                <head><meta charset="utf-8"><title>web-apache</title></head>
                <body>
                  <h1>web-apache</h1>
                  <p>Contenedor LXC 132 del laboratorio Proxmox, servido por Apache.
                  La forma del invitado la declara la capa 1; Apache y este vhost, la capa 2.</p>
                </body>
              </html>
      # Proof from OUTSIDE the guest, after convergence.
      http:
        - address: ":80"
          expect_status: 200
          expect_body: "web-apache"

# ============================================================================
# QEMU VMs — same declarative rules as the containers, with one important
# difference: proxmox_kvm refuses to update net/scsi/ide/sata/virtio (updating
# them can regenerate a MAC or recreate a disk), so for a VM those, plus
# bios/machine/scsihw/ostype, are creation-time: drift in them is REFUSED by
# apply.yml instead of converged.
# ============================================================================
pve_vm_defaults:
  # ---- creation-time: PVE cannot change these on an existing VM --------
  bios: seabios
  machine: q35
  scsihw: virtio-scsi-single
  ostype: l26

  # ---- power state ----------------------------------------------------
  # started | stopped
  status: stopped

  # ---- resources and behaviour (converged in place) --------------------
  sockets: 1
  cpu: host
  vga: std
  onboot: false
  boot: "order=ide2;scsi0"
  description: "Nested Proxmox VE managed by proxmox-ansible-lxc-test. The installation itself is finished by hand from the noVNC console."
  tags: [nested, pve, ansible-managed]

  # ---- attachments (creation-time; empty = must not exist) -------------
  net: {}
  scsi: {}
  sata: {}
  ide: {}
  virtio: {}

  # ---- the key at birth, for cloud-init capable images -----------------
  # A container gets its key through `pubkey`; a VM has no equivalent, so the
  # framework uses the same key through cloud-init: a cloud-init drive plus
  # `ciuser`/`sshkeys`. Both are creation-time (the drive is an `ide2` disk,
  # which proxmox_kvm refuses to update).
  #
  # It is ON by default because every VM this framework creates should be born
  # reachable, and OFF for an image that does not run cloud-init — the Proxmox
  # VE installer ISO, for instance, would never read it. Declaring
  # `cloudinit: false` on such a guest is the explicit opt-out.
  cloudinit: true
  cloudinit_storage: local-zfs
  ciuser: root
  sshkeys: "{{ pve_defaults.pubkey }}"
  # ipconfig0/config0 would move the VM's addressing into cloud-init; the
  # framework keeps addressing where it already lives (the `net` value) to have
  # one home for it.

# The VMs this repository manages — and nothing else.
pve_vms:
  - vmid: 120
    name: pve-nested
    cores: 4
    memory: 4096
    # Boots the Proxmox VE installer from the ISO already on the node.
    status: started
    # Opt-out, and the reason the default had to be overridable: the installer
    # ISO does not run cloud-init, so a cloud-init drive would be dead weight.
    cloudinit: false
    net:
      # vmbr1 is the internal LAN (10.10.10.0/24) where every other lab guest
      # lives. vmbr0 is the PUBLIC bridge (54.36.168.83/24 on eno3): do not put
      # a lab guest there unless you mean to expose it to the internet.
      net0: "virtio,bridge=vmbr1"
    scsi:
      scsi0: "local-zfs:32"
    ide:
      ide2: "local:iso/proxmox-ve_9.2-1.iso,media=cdrom"

# ============================================================================
# Layer 2 — configuration targets (guest-side, over SSH).
#
# Layer 1 NEVER reads this list. These guests are configured from the inside by
# configure/*.yml while their PVE shape stays unmanaged by this repository:
# partial adoption, stated explicitly rather than implied.
#
# `manage: false` means "read only": configure/audit.yml inspects the guest and
# changes nothing. Converging it is a separate, deliberate step, and the flag is
# the switch — a guest is never configured by accident.
#
# When you decide to adopt a guest fully, move its entry into pve_containers with
# its shape declared faithfully; do not keep it in both lists.
# ============================================================================
pve_config_targets:
  - vmid: 101
    hostname: caddy
    address: 10.10.10.2
    manage: false
