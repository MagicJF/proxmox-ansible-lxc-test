# Desired state of the disposable test LXC.
#
# This is the only file that changes when a change is requested: edit it, open a
# branch, run preflight -> apply. The playbooks under playbooks/ are the fixed
# engine and should not grow one file per request.
#
# Note: this is a group_vars FILE for the group "all", so variables sit at the top
# level — they must NOT be nested under an "all:" key (that would just define one
# variable named "all").

# Identity (fixed for the life of the container; PVE cannot change either, so a
# change here means "recreate", not "converge").
pve_node: Proxmox
pve_vmid: 102
pve_hostname: test-from-ansible

# Resources (converged in place by playbooks/apply.yml).
pve_cores: 2
pve_memory: 2048
pve_swap: 512
pve_onboot: false

# Creation-time properties. PVE cannot change these on an existing container;
# preflight reports them as blocking drift instead of pretending to converge.
pve_unprivileged: true
pve_storage: local-zfs
pve_rootfs_size: 8
pve_template: "local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst"
pve_template_storage: local
