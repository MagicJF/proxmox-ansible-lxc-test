# ============================================================================
# Desired state of every guest this repository manages.
#
# This is the only file that changes when a change is requested: edit it, open a
# branch, run preflight -> apply. The playbooks under playbooks/ are a fixed
# engine (preflight, apply, connect, remove) and never grow one file per request.
#
# It is a group_vars FILE for the group "all", so variables sit at the top level.
# Nesting them under an "all:" key would define one variable named "all" and
# leave every real variable undefined.
#
# Everything the provisioning module can set is declared here, including the
# settings that must NOT exist (null / empty): absence is state too, so the
# engine deletes anything that appears where the file declares nothing.
# ============================================================================

pve_node: Proxmox

# ============================================================================
# EL LABORATORIO DE TRES SEDES — la única verdad de su direccionamiento.
#
# La topología es la de una empresa pequeña con una central y dos delegaciones:
#
#   SEDE 1 (central)              SEDE 2 (delegación)     SEDE 3 (delegación)
#     ws1 ws2   ws3 ws4             ws5 ws6                 ws7 ws8
#        │         │                   │                       │
#      sw1 ═════ sw2                  sw3                     sw4
#        │                             │                       │
#       rt1 ════ WAN 1 ════ rt2         rt1 ════ WAN 2 ════ rt3
#
# Cuatro switches y tres routers RouterOS. Cada switch es L2 PURO —conmuta y NO
# enruta: su dirección es sólo de administración— y cada router es la puerta de
# enlace de su sede. Eso es lo que hace que esto sea la topología de una red real
# y no una colección de máquinas con direcciones.
#
# El reparto es JERÁRQUICO (hub-and-spoke): rt1 es la central y conoce las dos
# redes remotas; rt2 y rt3 tienen una ruta POR DEFECTO hacia rt1. Es la
# configuración real de una delegación, y añadir una cuarta sede es una entrada
# más y una ruta más en el hub.
#
# Direccionamiento — una línea por decisión, para que se lea de un vistazo:
#   10.10.10.0/24   la LAN de PVE, donde vive la pata de GESTIÓN de cada RouterOS
#   10.11.0.0/24    SEDE 1 — 4 workstations, puerta 10.11.0.1 en rt1
#   10.12.0.0/24    SEDE 2 — 2 workstations, puerta 10.12.0.1 en rt2
#   10.13.0.0/24    SEDE 3 — 2 workstations, puerta 10.13.0.1 en rt3
#   10.99.1.0/30    cable punto a punto rt1<->rt2 (WAN 1): .1 = rt1, .2 = rt2
#   10.99.2.0/30    cable punto a punto rt1<->rt3 (WAN 2): .1 = rt1, .2 = rt3
#
# La dirección de gestión de cada RouterOS acaba en su propio VMID: sw1 es .160
# porque su vmid es 160. Una regla, no una tabla de excepciones.
#
# Y las WORKSTATIONS no declaran aquí su dirección: cada una lleva la suya en su
# propia entrada, porque es su identidad en el segmento, y el router la deriva de
# ahí. Una sola verdad, no dos que se separan.
# ============================================================================
lab_site1_network: "10.11.0.0/24"
lab_site1_gateway: "10.11.0.1"
lab_site1_pool: "10.11.0.100-10.11.0.199"
lab_site2_network: "10.12.0.0/24"
lab_site2_gateway: "10.12.0.1"
lab_site2_pool: "10.12.0.100-10.12.0.199"
lab_site3_network: "10.13.0.0/24"
lab_site3_gateway: "10.13.0.1"
lab_site3_pool: "10.13.0.100-10.13.0.199"
lab_wan1_network: "10.99.1.0/30"
lab_wan1_hub: "10.99.1.1"
lab_wan1_spoke: "10.99.1.2"
lab_wan2_network: "10.99.2.0/30"
lab_wan2_hub: "10.99.2.1"
lab_wan2_spoke: "10.99.2.2"
# La red del cliente del túnel (el nodo de control). Los routers necesitan una
# ruta de VUELTA hacia ella, o una workstation que conteste al control node
# mandaría la respuesta por su ruta por defecto y se perdería. Es la
# contrapartida de pve_tunnel.endpoint_routes.
lab_control_network: "10.99.99.0/24"
lab_control_via: "10.10.10.1"

# ============================================================================
# The automation key every guest is born with — a framework default, not a
# per-guest decision.
#
# PVE's LXC `pubkey` parameter writes this public key into the guest's
# /root/.ssh/authorized_keys AT CREATION. It is a birth-time property: the
# module never forwards it on update, so layer 1 can set it and cannot re-read
# it afterwards, and layer 2 (configure/) is what verifies it from the inside.
#
# The single source of truth is the key FILE, not a copy of its text:
#   pve_ssh_pubkey_path -> the .pub next to the private key used by configure/
# If the file is absent the lookup yields nothing and no key is injected, so a
# clone of this repository without the key still runs (it just has no SSH
# automation until the path is provided).
#
# Opting a single guest out is explicit: declare `pubkey: ""` on that guest.
# ============================================================================
pve_ssh_pubkey_path: "/home/hermes/.hermes/profiles/hermione/secrets/pve-automation_ed25519.pub"

# ============================================================================
# The control node's PATH into the guest LAN — the precondition layer 2 runs on.
#
# The PVE API answers on the public address from anywhere, but the guests live on
# an internal bridge (vmbr1) the control node is not attached to. Layer 2 is SSH,
# so without a path every guest is "unreachable" for a reason that has nothing to
# do with its key. The path is therefore declared here and converged like any
# other resource:
#
#   ansible-playbook playbooks/connect.yml      # converge the path on its own
#   ansible-playbook configure/site.yml         # brings it up AUTOMATICALLY when
#                                               # no guest answers on :22
#
# Keys follow the same rule as the SSH automation key: the private half is a file
# outside the repository (generated here if absent, never printed) and only the
# PUBLIC half travels. Set `manage: false` to get layer 2's plain behaviour when
# this node already routes to the guest LAN.
# ============================================================================
pve_tunnel:
  manage: true
  # Interface name on this node; also the unit name (wg-quick@<name>).
  name: wg-lab
  # The endpoint lives on the lab side. The API cannot configure the Proxmox
  # host, so that half is bootstrapped once with
  # playbooks/tools/wg_endpoint_setup.sh (connect.yml prints the exact command
  # WITH this node's public key when there is no handshake).
  endpoint: "54.36.168.83:51820"
  # The endpoint's public key — public, safe to commit. It is what authenticates
  # the lab side of the tunnel.
  endpoint_public_key: "3+bBS+GqR4EtWUFst+2s49rneVguWquuRBGINt/tZXQ="
  # This node's address inside the tunnel (own /24, never the guest LAN).
  address: "10.99.99.2/24"
  # Only the lab's networks are routed through the tunnel; everything else (the
  # API on its public address) keeps using the normal path. It is a LIST because
  # the lab's guests no longer share one subnet: each site is its own network and
  # is reachable only THROUGH the MikroTik topology, so the control node needs a
  # route into each of them.
  guest_network:
    - "10.10.10.0/24"   # la LAN de gestión (el host y las patas de gestión)
    - "10.11.0.0/24"    # SEDE 1, detrás de rt1
    - "10.12.0.0/24"    # SEDE 2, detrás de rt2
    - "10.13.0.0/24"    # SEDE 3, detrás de rt3
  # Rutas que el ENDPOINT (el host Proxmox) necesita para entregar el tráfico del
  # túnel a una red que no tiene conectada. Sin ellas el control node alcanza al
  # router de la sede pero no a las workstations que están detrás: el endpoint
  # manda esos paquetes por su ruta por defecto y mueren en el camino.
  #
  # Es la única línea que hay que pegar a mano, y la aplica el MISMO script que
  # ya se pega una vez (playbooks/tools/wg_endpoint_setup.sh), que la recibe como
  # último argumento. `via` es la dirección de gestión del router de esa red, que
  # es como se llega a la red de una sede en la vida real: por la pata de
  # administración de su router.
  endpoint_routes:
    - to: "{{ lab_site1_network }}"
      via: "10.10.10.162"   # rt1
    - to: "{{ lab_site2_network }}"
      via: "10.10.10.164"   # rt2
    - to: "{{ lab_site3_network }}"
      via: "10.10.10.166"   # rt3
  # No extension, like an SSH key: the public half is this path plus `.pub`.
  private_key_path: "/home/hermes/.hermes/profiles/hermione/secrets/wg-lab-client"
  keepalive: 25

# ============================================================================
# Host-level network segments, created through the PVE API.
#
# These are LINKS, not a switching fabric: each one is a bridge with no ports
# that carries exactly one point-to-point cable between two guests, and nothing
# else. All the switching and routing happens inside the MikroTik CHRs, exactly
# as it would on real hardware — if two guests shared a bridge, Proxmox would be
# doing the switching and the routers would be decoration.
#
# `bridge_ports` empty is what makes a link isolated. Only creation is
# automated: a segment that already exists is left alone, because recreating a
# bridge under a running lab would cut its guests off.
#
# Catorce cables. El nombre de cada bridge describe el CABLE, y por eso aparece
# literal en sus dos puntas: en el `netif` de la workstation y en el `net` del
# router. El validador del manifiesto rechaza un bridge citado que no esté
# declarado aquí, así que una errata no puede dejar un cable de una sola punta.
# ============================================================================
pve_bridges:
  # ---- SEDE 1 ---------------------------------------------------------------
  - iface: vmbr4
    comments: "cable: ws1 eth0 <-> sw1 ether2 (acceso, sin etiquetar)"
  - iface: vmbr5
    comments: "cable: ws2 eth0 <-> sw1 ether3 (acceso, sin etiquetar)"
  - iface: vmbr6
    comments: "cable: ws3 eth0 <-> sw2 ether2 (acceso, sin etiquetar)"
  - iface: vmbr7
    comments: "cable: ws4 eth0 <-> sw2 ether3 (acceso, sin etiquetar)"
  - iface: vmbr8
    comments: "cable: sw1 ether4 <-> sw2 ether4 (TRONCAL L2 entre los dos switches)"
  - iface: vmbr9
    comments: "cable: sw1 ether5 <-> rt1 ether2 (el switch entrega la sede a su router)"
  # ---- SEDE 2 ---------------------------------------------------------------
  - iface: vmbr10
    comments: "cable: ws5 eth0 <-> sw3 ether2"
  - iface: vmbr11
    comments: "cable: ws6 eth0 <-> sw3 ether3"
  - iface: vmbr12
    comments: "cable: sw3 ether4 <-> rt2 ether2"
  # ---- SEDE 3 ---------------------------------------------------------------
  - iface: vmbr13
    comments: "cable: ws7 eth0 <-> sw4 ether2"
  - iface: vmbr14
    comments: "cable: ws8 eth0 <-> sw4 ether3"
  - iface: vmbr15
    comments: "cable: sw4 ether4 <-> rt3 ether2"
  # ---- LA WAN: dos enlaces punto a punto, no un segmento compartido ---------
  - iface: vmbr16
    comments: "WAN 1: rt1 ether3 <-> rt2 ether3 (10.99.1.0/30)"
  - iface: vmbr17
    comments: "WAN 2: rt1 ether4 <-> rt3 ether3 (10.99.2.0/30)"

pve_defaults:
  # ---- creation-time: PVE cannot change these on an existing container ------
  # Drift here is refused, not converged: the container would have to be
  # recreated (and rootfs growth cannot be undone at all).
  template: "local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst"
  template_storage: local
  storage: local-zfs
  rootfs_size: 8
  unprivileged: true
  ostype: debian

  # ---- power state ---------------------------------------------------------
  # started | stopped
  status: stopped

  # ---- resources (converged in place) --------------------------------------
  memory: 2048
  swap: 512
  cores: 2
  # cpuunits only: the module's `cpus` parameter means cpuunits on creation but
  # cpulimit on update, so it cannot be declared coherently. Use cpuunits.
  cpuunits: 1024

  # ---- behaviour (converged in place) --------------------------------------
  onboot: false
  description: "Managed by proxmox-ansible-lxc-test. Declare changes in inventory/group_vars/all.yml."
  tags: [ansible-managed, lab]
  # PVE accepts the literal "host" to follow the node's timezone.
  timezone: host
  # tty | console | shell
  cmode: shell
  # List form, joined by the module. Empty list = must not exist.
  features: []
  startup: []

  # ---- network (converged in place; empty = no interface at all) ----------
  netif: {}
  nameserver: null
  searchdomain: null

  # ---- attachments (converged in place; empty = must not exist) -----------
  hookscript: null
  mounts: {}
  mount_devices: []

  # ---- the key at birth (see pve_ssh_pubkey_path above) --------------------
  pubkey: "{{ lookup('file', pve_ssh_pubkey_path, errors='ignore') | default('', true) | trim }}"
  # password: creation-time secret, which would have to live in Git — not
  #           declared; inject it from a vault at creation time if ever needed.
  # clone / clone_type: alternative creation path, unused here.
  # pool: no pool exists on this node.
  # force / purge / destroy_unreferenced_disks: destructive control flags, never
  #           automated by the engine.

# The containers this repository manages — and nothing else. A container absent
# from this list is never read, created or modified.
# vmid + hostname are identity; changing them means "recreate".
# Any key of pve_defaults may be overridden per container.
pve_containers:
  # Observability test container: every attribute below is randomly generated
  # and overrides the defaults. It also proves the key-at-birth default: it was
  # created by this engine, so it has /root/.ssh/authorized_keys already.
  - vmid: 167
    hostname: ct-forge-5f2a
    rootfs_size: 7
    cores: 5
    memory: 2560
    swap: 896
    cpuunits: 512
    onboot: true
    status: started
    cmode: tty
    timezone: host
    tags: [canary, lab, tier1]
    description: "Generated by the observability test at 2026-11-04; every attribute below is random."
    features: []
    startup: []
    nameserver: 9.9.9.9
    searchdomain: null
    netif:
      net0: "name=eth0,bridge=vmbr0,ip=dhcp"
    mounts:
      mp0: "local:5,mp=/mnt/data"

  # TiddlyWiki service. Layer 1 owns the guest's shape; layer 2 owns the wiki,
  # its dependencies and the unit that serves it on every boot.
  - vmid: 131
    hostname: wiki-tiddly
    cores: 1
    memory: 1024
    rootfs_size: 6
    swap: 512
    status: started
    tags: [wiki, lab]
    description: "TiddlyWiki server: shape owned by layer 1, the wiki and its service owned by layer 2."
    netif:
      # Static on the LAN bridge: layer 2 derives the SSH target from here, and a
      # DHCP-only guest cannot be reached (nor can its URL be declared once).
      net0: "name=eth0,bridge=vmbr1,gw=10.10.10.1,ip=10.10.10.31/24,ip6=auto"

    # ---- layer 2 (configure/). Layer 1 ignores the `config` block. -----------
    manage: true
    config:
      tiddlywiki:
        wiki_dir: /srv/tiddlywiki
        port: 8080
        # Pinned on purpose: a rebuild must install the same wiki engine. This is
        # the version published as `latest` on npm when the guest was declared.
        version: "5.4.1"
        service_user: tiddlywiki
        # Where it binds. 0.0.0.0 makes it reachable from the LAN (the point of
        # serving it) — a TiddlyWiki server edition is writable and
        # unauthenticated, so this is an explicit exposure decision and the guest
        # must stay on a network that is not public.
        listen_host: "0.0.0.0"
      # Proof from OUTSIDE the guest, asserted after convergence: the declaration
      # says which status and body the URL must answer.
      http:
        - address: ":8080"
          expect_status: 200
          expect_body: "TiddlyWiki"

  # ---------------------------------------------------------------------------
  # LAS OCHO WORKSTATIONS — ordenadores, no contenedores con pata de gestión.
  #
  # Cada una es un PC: UNA sola NIC, en su propio bridge aislado (el latiguillo
  # RJ45 hacia su switch) y SIN interfaz de gestión. Así se hace en una empresa:
  # un PC de oficina tiene un interfaz y recibe su dirección por DHCP; nadie le
  # pone un segundo NIC "de gestión", y nadie entra en él por SSH desde la red —
  # la gestión real de un parque es un agente que SALE hacia fuera, nunca una
  # conexión hacia dentro.
  #
  # Por eso ninguna declara `config:` y capa 2 no entra en ellas. Su dirección la
  # reparte por DHCP el router de su sede, con una reserva atada a la MAC, y el
  # `address:` de aquí ES esa reserva: el router la deriva de esta entrada, así
  # que no hay dos sitios donde pueda desincronizarse.
  #
  # La verificación no necesita entrar en ellas — sale de los ROUTERS, que es
  # como prueba una red un ingeniero de redes: /ping, /tool/traceroute, /ip/arp,
  # /ip/dhcp-server/lease y /interface/bridge/host.
  #
  # La MAC va declarada porque es lo que ata la reserva a la interfaz, y porque
  # el nombre del bridge tiene que coincidir con la punta del cable en el router:
  # el validador del manifiesto comprueba las dos cosas.
  #
  # Esquema de MAC: BC:24:11:00:<clase>:<índice>, con 50 = workstation y 60+n =
  # el RouterOS número n. Legible al buscar en la tabla de conmutación.
  # ---------------------------------------------------------------------------
  - vmid: 150
    hostname: ws1
    site: sede1
    address: "10.11.0.11"
    cores: 1
    memory: 256
    rootfs_size: 4
    swap: 256
    status: started
    tags: [netlab, workstation, sede1]
    # Último escalón: su dirección se la da por DHCP el router de su sede, así
    # que arrancarla a la vez que su router es una carrera que pierde.
    onboot: true
    startup: ["order=3"]
    manage: true
    config:
      # Una workstation no tiene dirección estática: la pide por DHCP al router de
      # su sede. Eso la dejaba fuera de capa 2 (el framework no puede alcanzar a un
      # invitado sólo-DHCP) y, peor, hacía que un arranque en frío la dejara sin
      # dirección: dhclient se rinde a los 60 s por defecto y el troncal
      # sw1<->sw2 tarda más en converger, así que nadie reintentaba. Aquí se le da
      # margen de sobra y se declara `manage: true` para que, si aun así no aparece,
      # el fallo se oiga en vez de pasar desapercibido.
      netlab:
        dhcp:
          timeout: 300
          retry: 30
    description: "Workstation 1 (sede 1): una sola NIC en el cable hacia sw1. Sin pata de gestión, como un PC."
    netif:
      net0: "name=eth0,bridge=vmbr4,hwaddr=BC:24:11:00:50:01,ip=dhcp"

  - vmid: 151
    hostname: ws2
    site: sede1
    address: "10.11.0.12"
    cores: 1
    memory: 256
    rootfs_size: 4
    swap: 256
    status: started
    tags: [netlab, workstation, sede1]
    # Último escalón: su dirección se la da por DHCP el router de su sede, así
    # que arrancarla a la vez que su router es una carrera que pierde.
    onboot: true
    startup: ["order=3"]
    manage: true
    config:
      # Una workstation no tiene dirección estática: la pide por DHCP al router de
      # su sede. Eso la dejaba fuera de capa 2 (el framework no puede alcanzar a un
      # invitado sólo-DHCP) y, peor, hacía que un arranque en frío la dejara sin
      # dirección: dhclient se rinde a los 60 s por defecto y el troncal
      # sw1<->sw2 tarda más en converger, así que nadie reintentaba. Aquí se le da
      # margen de sobra y se declara `manage: true` para que, si aun así no aparece,
      # el fallo se oiga en vez de pasar desapercibido.
      netlab:
        dhcp:
          timeout: 300
          retry: 30
    description: "Workstation 2 (sede 1): una sola NIC en el cable hacia sw1."
    netif:
      net0: "name=eth0,bridge=vmbr5,hwaddr=BC:24:11:00:50:02,ip=dhcp"

  - vmid: 152
    hostname: ws3
    site: sede1
    address: "10.11.0.13"
    cores: 1
    memory: 256
    rootfs_size: 4
    swap: 256
    status: started
    tags: [netlab, workstation, sede1]
    # Último escalón: su dirección se la da por DHCP el router de su sede, así
    # que arrancarla a la vez que su router es una carrera que pierde.
    onboot: true
    startup: ["order=3"]
    manage: true
    config:
      # Una workstation no tiene dirección estática: la pide por DHCP al router de
      # su sede. Eso la dejaba fuera de capa 2 (el framework no puede alcanzar a un
      # invitado sólo-DHCP) y, peor, hacía que un arranque en frío la dejara sin
      # dirección: dhclient se rinde a los 60 s por defecto y el troncal
      # sw1<->sw2 tarda más en converger, así que nadie reintentaba. Aquí se le da
      # margen de sobra y se declara `manage: true` para que, si aun así no aparece,
      # el fallo se oiga en vez de pasar desapercibido.
      netlab:
        dhcp:
          timeout: 300
          retry: 30
    description: "Workstation 3 (sede 1): una sola NIC en el cable hacia sw2. Para llegar a ella hay que cruzar el troncal entre los dos switches."
    netif:
      net0: "name=eth0,bridge=vmbr6,hwaddr=BC:24:11:00:50:03,ip=dhcp"

  - vmid: 153
    hostname: ws4
    site: sede1
    address: "10.11.0.14"
    cores: 1
    memory: 256
    rootfs_size: 4
    swap: 256
    status: started
    tags: [netlab, workstation, sede1]
    # Último escalón: su dirección se la da por DHCP el router de su sede, así
    # que arrancarla a la vez que su router es una carrera que pierde.
    onboot: true
    startup: ["order=3"]
    manage: true
    config:
      # Una workstation no tiene dirección estática: la pide por DHCP al router de
      # su sede. Eso la dejaba fuera de capa 2 (el framework no puede alcanzar a un
      # invitado sólo-DHCP) y, peor, hacía que un arranque en frío la dejara sin
      # dirección: dhclient se rinde a los 60 s por defecto y el troncal
      # sw1<->sw2 tarda más en converger, así que nadie reintentaba. Aquí se le da
      # margen de sobra y se declara `manage: true` para que, si aun así no aparece,
      # el fallo se oiga en vez de pasar desapercibido.
      netlab:
        dhcp:
          timeout: 300
          retry: 30
    description: "Workstation 4 (sede 1): una sola NIC en el cable hacia sw2."
    netif:
      net0: "name=eth0,bridge=vmbr7,hwaddr=BC:24:11:00:50:04,ip=dhcp"

  - vmid: 154
    hostname: ws5
    site: sede2
    address: "10.12.0.11"
    cores: 1
    memory: 256
    rootfs_size: 4
    swap: 256
    status: started
    tags: [netlab, workstation, sede2]
    # Último escalón: su dirección se la da por DHCP el router de su sede, así
    # que arrancarla a la vez que su router es una carrera que pierde.
    onboot: true
    startup: ["order=3"]
    manage: true
    config:
      # Una workstation no tiene dirección estática: la pide por DHCP al router de
      # su sede. Eso la dejaba fuera de capa 2 (el framework no puede alcanzar a un
      # invitado sólo-DHCP) y, peor, hacía que un arranque en frío la dejara sin
      # dirección: dhclient se rinde a los 60 s por defecto y el troncal
      # sw1<->sw2 tarda más en converger, así que nadie reintentaba. Aquí se le da
      # margen de sobra y se declara `manage: true` para que, si aun así no aparece,
      # el fallo se oiga en vez de pasar desapercibido.
      netlab:
        dhcp:
          timeout: 300
          retry: 30
    description: "Workstation 5 (sede 2, delegación): en la red de rt2, al otro lado de la WAN 1."
    netif:
      net0: "name=eth0,bridge=vmbr10,hwaddr=BC:24:11:00:50:05,ip=dhcp"

  - vmid: 155
    hostname: ws6
    site: sede2
    address: "10.12.0.12"
    cores: 1
    memory: 256
    rootfs_size: 4
    swap: 256
    status: started
    tags: [netlab, workstation, sede2]
    # Último escalón: su dirección se la da por DHCP el router de su sede, así
    # que arrancarla a la vez que su router es una carrera que pierde.
    onboot: true
    startup: ["order=3"]
    manage: true
    config:
      # Una workstation no tiene dirección estática: la pide por DHCP al router de
      # su sede. Eso la dejaba fuera de capa 2 (el framework no puede alcanzar a un
      # invitado sólo-DHCP) y, peor, hacía que un arranque en frío la dejara sin
      # dirección: dhclient se rinde a los 60 s por defecto y el troncal
      # sw1<->sw2 tarda más en converger, así que nadie reintentaba. Aquí se le da
      # margen de sobra y se declara `manage: true` para que, si aun así no aparece,
      # el fallo se oiga en vez de pasar desapercibido.
      netlab:
        dhcp:
          timeout: 300
          retry: 30
    description: "Workstation 6 (sede 2, delegación): en la red de rt2."
    netif:
      net0: "name=eth0,bridge=vmbr11,hwaddr=BC:24:11:00:50:06,ip=dhcp"

  - vmid: 156
    hostname: ws7
    site: sede3
    address: "10.13.0.11"
    cores: 1
    memory: 256
    rootfs_size: 4
    swap: 256
    status: started
    tags: [netlab, workstation, sede3]
    # Último escalón: su dirección se la da por DHCP el router de su sede, así
    # que arrancarla a la vez que su router es una carrera que pierde.
    onboot: true
    startup: ["order=3"]
    manage: true
    config:
      # Una workstation no tiene dirección estática: la pide por DHCP al router de
      # su sede. Eso la dejaba fuera de capa 2 (el framework no puede alcanzar a un
      # invitado sólo-DHCP) y, peor, hacía que un arranque en frío la dejara sin
      # dirección: dhclient se rinde a los 60 s por defecto y el troncal
      # sw1<->sw2 tarda más en converger, así que nadie reintentaba. Aquí se le da
      # margen de sobra y se declara `manage: true` para que, si aun así no aparece,
      # el fallo se oiga en vez de pasar desapercibido.
      netlab:
        dhcp:
          timeout: 300
          retry: 30
    description: "Workstation 7 (sede 3, delegación): en la red de rt3, al otro lado de la WAN 2."
    netif:
      net0: "name=eth0,bridge=vmbr13,hwaddr=BC:24:11:00:50:07,ip=dhcp"

  - vmid: 157
    hostname: ws8
    site: sede3
    address: "10.13.0.12"
    cores: 1
    memory: 256
    rootfs_size: 4
    swap: 256
    status: started
    tags: [netlab, workstation, sede3]
    # Último escalón: su dirección se la da por DHCP el router de su sede, así
    # que arrancarla a la vez que su router es una carrera que pierde.
    onboot: true
    startup: ["order=3"]
    manage: true
    config:
      # Una workstation no tiene dirección estática: la pide por DHCP al router de
      # su sede. Eso la dejaba fuera de capa 2 (el framework no puede alcanzar a un
      # invitado sólo-DHCP) y, peor, hacía que un arranque en frío la dejara sin
      # dirección: dhclient se rinde a los 60 s por defecto y el troncal
      # sw1<->sw2 tarda más en converger, así que nadie reintentaba. Aquí se le da
      # margen de sobra y se declara `manage: true` para que, si aun así no aparece,
      # el fallo se oiga en vez de pasar desapercibido.
      netlab:
        dhcp:
          timeout: 300
          retry: 30
    description: "Workstation 8 (sede 3, delegación): en la red de rt3."
    netif:
      net0: "name=eth0,bridge=vmbr14,hwaddr=BC:24:11:00:50:08,ip=dhcp"

  # ---------------------------------------------------------------------------
  # El bootstrap de los SIETE routers: el único punto que la API de PVE no puede
  # resolver.
  #
  # Un CHR recién importado arranca SIN dirección (sólo un cliente DHCP en
  # ether1) y, al ser una VM, no puede tomar una concesión del DHCP del host: la
  # oferta llega con un checksum de UDP que el kernel del invitado descarta (está
  # medido en este lab). Sin dirección no hay API REST, así que hace falta algo
  # que le dé la primera.
  #
  # Este contenedor es ese algo: vive en la MISMA pata de gestión que los routers
  # (vmbr1), corre dnsmasq atado a las MACs de sus ether1 y con el offload de TX
  # desactivado (sin eso su propia oferta tendría el mismo checksum roto), y
  # concede exactamente una dirección a cada uno. A partir de ahí todo lo demás lo
  # hace la API REST, y este contenedor no vuelve a intervenir.
  #
  # Las reservas se DERIVAN de la declaración de cada router —la MAC de su net0 y
  # la dirección que ya declara en ether1—, así que aquí no se repite ningún valor
  # y no pueden separarse. Un router nuevo en la lista es una reserva más.
  #
  # Dirección estática a propósito: es infraestructura, no una workstation, y
  # layer 2 tiene que poder entrar a configurarla antes de que el lab exista.
  #
  # MEDIDO: es la sala de partos, no una dependencia de funcionamiento. Arrancando
  # el laboratorio con este contenedor APAGADO y confirmado apagado durante toda la
  # prueba, los siete equipos de red contestaron su API en 20 s con su
  # `10.10.10.16x/24` y cero clientes DHCP, y las ocho estaciones obtuvieron su
  # dirección de sus routers. Su trabajo de DHCP es de UNA vez por equipo, y sus
  # direcciones se quedan en el disco del CHR. Lo que sí sostiene es el salto SSH
  # hacia las sedes, y por eso sigue siendo el primer escalón.
  # ---------------------------------------------------------------------------
  - vmid: 143
    hostname: lab-bootstrap
    # Primer escalón: es el salto SSH hacia las tres sedes, así que tiene que
    # estar en pie antes de que la capa 2 llegue a nada que esté detrás de un router.
    onboot: true
    startup: ["order=1"]
    cores: 1
    # 1 GiB, not 256 MiB: apt on Debian 13 gets OOM-killed below ~512 MiB, and
    # this guest exists to install dnsmasq once and then sit still.
    memory: 1024
    rootfs_size: 4
    swap: 256
    status: started
    tags: [netlab, bootstrap, lab]
    description: "Concede a cada router su primera dirección por DHCP (atada a su MAC) para que su API REST exista. No hace nada más."
    netif:
      net0: "name=eth0,bridge=vmbr1,gw=10.10.10.1,ip=10.10.10.53/24"
    manage: true
    config:
      bootstrap:
        interface: eth0
        # A qué tiene que saber VOLVER este contenedor: las redes de las tres
        # sedes. Sin esto recibe los pings de una workstation y no puede
        # contestarlos, porque su ruta por defecto va al host, y el host no
        # enruta hacia el interior del lab.
        routes:
          - "{{ lab_site1_network }}"
          - "{{ lab_site2_network }}"
          - "{{ lab_site3_network }}"
        # Se lo enseña el router de la central, por su dirección de gestión.
        route_gateway: "10.10.10.162"
        hosts: >-
          {%- set out = [] -%}
          {%- for v in pve_vms | selectattr('chr', 'defined') -%}
          {%-   set mac = v.net.net0 | regex_replace('^.*virtio=([0-9A-Fa-f:]{17}).*$', '\\1') -%}
          {%-   set mgmt = v.config.routeros.addresses
                          | selectattr('interface', 'equalto', 'ether1') | first -%}
          {%-   set _ = out.append({'mac': mac,
                                    'address': mgmt.address.split('/')[0],
                                    'name': v.name}) -%}
          {%- endfor -%}
          {{ out }}

# ============================================================================
# QEMU VMs — same declarative rules as the containers, with one important
# difference: proxmox_kvm refuses to update net/scsi/ide/sata/virtio (updating
# them can regenerate a MAC or recreate a disk), so for a VM those, plus
# bios/machine/scsihw/ostype, are creation-time: drift in them is REFUSED by
# apply.yml instead of converged.
# ============================================================================
pve_vm_defaults:
  # ---- creation-time: PVE cannot change these on an existing VM --------
  bios: seabios
  machine: q35
  scsihw: virtio-scsi-single
  ostype: l26

  # ---- power state ----------------------------------------------------
  # started | stopped
  status: stopped

  # ---- resources and behaviour (converged in place) --------------------
  sockets: 1
  cpu: host
  vga: std
  onboot: false
  boot: "order=ide2;scsi0"
  description: "Nested Proxmox VE managed by proxmox-ansible-lxc-test. The installation itself is finished by hand from the noVNC console."
  tags: [nested, pve, ansible-managed]

  # ---- attachments (creation-time; empty = must not exist) -------------
  net: {}
  scsi: {}
  sata: {}
  ide: {}
  virtio: {}

  # ---- the key at birth, for cloud-init capable images -----------------
  # A container gets its key through `pubkey`; a VM has no equivalent, so the
  # framework uses the same key through cloud-init: a cloud-init drive plus
  # `ciuser`/`sshkeys`. Both are creation-time (the drive is an `ide2` disk,
  # which proxmox_kvm refuses to update).
  #
  # It is ON by default because every VM this framework creates should be born
  # reachable, and OFF for an image that does not run cloud-init — the Proxmox
  # VE installer ISO, for instance, would never read it. Declaring
  # `cloudinit: false` on such a guest is the explicit opt-out.
  cloudinit: true
  cloudinit_storage: local-zfs
  ciuser: root
  sshkeys: "{{ pve_defaults.pubkey }}"
  # ipconfig0/config0 would move the VM's addressing into cloud-init; the
  # framework keeps addressing where it already lives (the `net` value) to have
  # one home for it.

# ---- CHR (MikroTik RouterOS) defaults ---------------------------------------
# Shared by every router of the network lab. They sit ON TOP of pve_vm_defaults
# (which describe the nested PVE guest) and apply only to entries declaring
# `chr: true`, so the vendor image, the boot order and the console live in one
# block instead of seven copies.
pve_chr_defaults:
  # Los equipos de red van ANTES que las workstations: la petición DHCP de una
  # workstation la contesta el router de su sede, así que arrancarlos juntos es una
  # carrera que la workstation pierde. Y `onboot` es lo que hace que Proxmox
  # respete el orden siquiera: sin él deja al invitado quieto en el arranque del nodo.
  onboot: true
  # SIN `up=`: se cuenta por invitado y aquí sobra. Lo que hace falta es que los
  # siete estén escuchando ANTES de que arranque el escalón de las workstations, y
  # eso lo declara `pve_power_gap_after` una sola vez, no siete. Si alguna
  # workstation se adelantara, su cliente DHCP es paciente (`timeout 300`,
  # `retry 30`) y la puerta de direcciones de `apply.yml` no da la ejecución por
  # buena hasta que las ocho tienen la suya.
  startup: ["order=2"]
  # 1 core y 256 MiB por router: un CHR que conmuta y enruta sin hacer más no
  # necesita más, y son SIETE. 7 x 256 MiB = 1.75 GiB, que es lo que hace que el
  # lab entero quepa en los ~7.5 GiB libres del nodo.
  cores: 1
  memory: 256
  status: started
  manage: true
  # The vendor image has no cloud-init, so the drive would be dead weight.
  cloudinit: false
  # CHR is an i440fx-era image: it boots on the PC chipset, not on q35.
  machine: pc
  # The imported image is the only disk, so it must be the boot device (the
  # default order expects the cloud-init drive this VM does not have).
  boot: "order=scsi0"
  tags: [netlab, routeros, lab]
  scsi:
    # 1 GiB y no 8: la imagen del fabricante ocupa 128 MiB y RouterOS CHR vive en
    # RAM, así que un disco grande aquí es espacio asignado que nadie usa.
    scsi0: "local-zfs:1"
  # The vendor image, imported instead of created: proxmox_kvm can only build a
  # disk from a size, so the raw image is uploaded to a storage that accepts
  # `import` and attached with the API's creation-time import-from syntax (see
  # playbooks/tasks/disk_import.yml). `key` is the disk the image fills.
  disk_import:
    - key: scsi0
      source: "local:import/chr-7.25.1.raw"
  # The console that respects a non-US keyboard: it carries CHARACTERS, not
  # scancodes. `vga: serial0` is what makes PVE's Console button open it — with
  # a VGA adapter the button opens noVNC and the port is only reachable from a
  # node shell. The trade-off, stated plainly: no screen, so the boot phase
  # shows nothing until RouterOS prints its prompt.
  serial:
    serial0: socket
  vga: serial0
  # NO `keyboard:` — deliberately. It only sets how the VNC server turns the
  # browser's keys into scancodes, and the LAST translation is the guest's own
  # console keymap, which in RouterOS is US with no setting to change it.

# The VMs this repository manages — and nothing else.
#
# SIETE routers MikroTik RouterOS: cuatro switches y tres routers, que es la
# topología de la red de tres sedes. Cada uno tiene una pata de GESTIÓN en vmbr1
# (todo switch administrable tiene su dirección de administración, y sin ella no
# habría forma de configurarlo) y el resto de sus patas son los CABLES del
# diagrama, uno por bridge.
#
# Los CUATRO SWITCHES son L2 PURO: ponen sus patas de datos en un bridge de
# RouterOS y NO le ponen dirección. Eso es lo que los hace switches y no routers
# — su dirección vive sólo en la pata de gestión. Un switch al que se le pone
# dirección en el bridge empieza a enrutar y la topología deja de ser la que dice
# el diagrama.
#
# Los TRES ROUTERS sí enrutan: la LAN de su sede en una pata, la WAN en otra, y
# las rutas estáticas declaradas abajo. rt1 es el hub y conoce las dos redes
# remotas; rt2 y rt3 tienen una ruta por defecto hacia él.
#
# Las MACs van todas declaradas, y no por gusto: las NICs de una VM son
# creation-time, así que una MAC generada por PVE sería drift contra un valor
# declarado vacío y `apply` lo RECHAZA. Esquema: BC:24:11:00:6<n>:0<p>, con n el
# número de router (1..7) y p el número de pata.
#
# El orden y el nombre de las patas importan: `ether1` es SIEMPRE la gestión,
# porque es la que el bootstrap direcciona y la que `addresses` usa. Cambiar ese
# orden deja al router sin API.
pve_vms:
  # =========================================================================
  # SEDE 1 — la central
  # =========================================================================

  # sw1: el switch de acceso que conecta ws1, ws2, el otro switch y el router.
  # Cuatro patas de datos (ether2..ether5) en UN bridge, sin dirección en él.
  - vmid: 160
    name: sw1
    chr: true
    net:
      net0: "virtio=BC:24:11:00:61:01,bridge=vmbr1"     # ether1 gestion
      net1: "virtio=BC:24:11:00:61:02,bridge=vmbr4"     # ether2 -> ws1
      net2: "virtio=BC:24:11:00:61:03,bridge=vmbr5"     # ether3 -> ws2
      net3: "virtio=BC:24:11:00:61:04,bridge=vmbr8"     # ether4 -> sw2 (troncal)
      net4: "virtio=BC:24:11:00:61:05,bridge=vmbr9"     # ether5 -> rt1
    config:
      routeros:
        identity: sw1
        addresses:
          - address: "10.10.10.160/24"
            interface: ether1
        # El switch. Sin `address` en el bridge: si la tuviera, enrutaría.
        bridges:
          - name: lan
            ports: [ether2, ether3, ether4, ether5]
        # Un CHR de fábrica trae un cliente DHCP en ether1. Con una dirección
        # estática declarada, ese cliente es drift y se elimina.
        dhcp_client: false
        # La puerta de enlace de GESTIÓN, que es lo que lleva un switch de verdad.
        # Sin ella, el switch recibe los pings de su sede y no puede contestarlos:
        # su tabla de rutas sólo conoce la red de gestión. Apunta al router de su
        # sede por su dirección de gestión — y ese router ya sabe volver a la sede.
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "10.10.10.162"

  # sw2: el segundo switch de acceso de la central. Cuelga de sw1 por el troncal
  # (mismo dominio L2, que es lo que hace que las cuatro workstations de la sede
  # compartan una sola red).
  - vmid: 161
    name: sw2
    chr: true
    net:
      net0: "virtio=BC:24:11:00:62:01,bridge=vmbr1"     # ether1 gestion
      net1: "virtio=BC:24:11:00:62:02,bridge=vmbr6"     # ether2 -> ws3
      net2: "virtio=BC:24:11:00:62:03,bridge=vmbr7"     # ether3 -> ws4
      net3: "virtio=BC:24:11:00:62:04,bridge=vmbr8"     # ether4 -> sw1 (troncal)
    config:
      routeros:
        identity: sw2
        addresses:
          - address: "10.10.10.161/24"
            interface: ether1
        bridges:
          - name: lan
            ports: [ether2, ether3, ether4]
        dhcp_client: false
        # Misma razón que en sw1: la puerta de enlace de gestión, al router de su
        # sede. Es lo que convierte al switch en un equipo gestionable de verdad.
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "10.10.10.162"

  # rt1: el router de la central y el núcleo de la WAN. Es la puerta de enlace de
  # su sede y el único que conoce las redes remotas; rt2 y rt3 dependen de él.
  - vmid: 162
    name: rt1
    chr: true
    net:
      net0: "virtio=BC:24:11:00:63:01,bridge=vmbr1"     # ether1 gestion
      net1: "virtio=BC:24:11:00:63:02,bridge=vmbr9"     # ether2 -> sw1 (la LAN de la sede)
      net2: "virtio=BC:24:11:00:63:03,bridge=vmbr16"    # ether3 -> WAN 1
      net3: "virtio=BC:24:11:00:63:04,bridge=vmbr17"    # ether4 -> WAN 2
    config:
      routeros:
        identity: rt1
        addresses:
          - address: "10.10.10.162/24"
            interface: ether1
          - address: "{{ lab_site1_gateway }}/24"
            interface: ether2
          - address: "{{ lab_wan1_hub }}/30"
            interface: ether3
          - address: "{{ lab_wan2_hub }}/30"
            interface: ether4
        dhcp_client: false
        # Las dos redes que rt1 ve por la WAN, más la vuelta hacia el nodo de
        # control. Los saltos ya existen como redes conectadas (ether3/ether4),
        # así que RouterOS instala estas rutas ACTIVAS.
        routes:
          - dst_address: "{{ lab_site2_network }}"
            gateway: "{{ lab_wan1_spoke }}"
          - dst_address: "{{ lab_site3_network }}"
            gateway: "{{ lab_wan2_spoke }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_control_via }}"
        dhcp_servers:
          - name: sede1
            interface: ether2
            address_pool: "{{ lab_site1_pool }}"
            network: "{{ lab_site1_network }}"
            gateway: "{{ lab_site1_gateway }}"
            dns_server: "{{ lab_site1_gateway }}"
            # Una reserva por workstation DE ESTA SEDE. La dirección y la MAC
            # salen de la declaración de la propia workstation: aquí no se repite
            # ningún valor, así que no pueden desincronizarse.
            leases: >-
              {%- set out = [] -%}
              {%- for c in pve_containers
                     | selectattr('site', 'defined')
                     | selectattr('site', 'equalto', 'sede1') -%}
              {%-   set _ = out.append({
                    'address': c.address,
                    'mac_address': c.netif.net0 | regex_replace('^.*hwaddr=([0-9A-Fa-f:]{17}).*$', '\\1'),
                    'comment': c.hostname }) -%}
              {%- endfor -%}
              {{ out }}

  # =========================================================================
  # SEDE 2 — delegación
  # =========================================================================

  # sw3: el switch de la delegación. Une sus dos workstations.
  - vmid: 163
    name: sw3
    chr: true
    net:
      net0: "virtio=BC:24:11:00:64:01,bridge=vmbr1"     # ether1 gestion
      net1: "virtio=BC:24:11:00:64:02,bridge=vmbr10"    # ether2 -> ws5
      net2: "virtio=BC:24:11:00:64:03,bridge=vmbr11"    # ether3 -> ws6
      net3: "virtio=BC:24:11:00:64:04,bridge=vmbr12"    # ether4 -> rt2
    config:
      routeros:
        identity: sw3
        addresses:
          - address: "10.10.10.163/24"
            interface: ether1
        bridges:
          - name: lan
            ports: [ether2, ether3, ether4]
        dhcp_client: false
        # Puerta de enlace de gestión hacia el router de SU sede (rt2).
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "10.10.10.164"

  # rt2: el router de la delegación. Una pata a su switch, una a la WAN 1, y una
  # ruta POR DEFECTO hacia rt1 — la configuración real de una delegación.
  - vmid: 164
    name: rt2
    chr: true
    net:
      net0: "virtio=BC:24:11:00:65:01,bridge=vmbr1"     # ether1 gestion
      net1: "virtio=BC:24:11:00:65:02,bridge=vmbr12"    # ether2 -> sw3 (la LAN de la sede)
      net2: "virtio=BC:24:11:00:65:03,bridge=vmbr16"    # ether3 -> WAN 1
    config:
      routeros:
        identity: rt2
        addresses:
          - address: "10.10.10.164/24"
            interface: ether1
          - address: "{{ lab_site2_gateway }}/24"
            interface: ether2
          - address: "{{ lab_wan1_spoke }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          # La delegación no necesita saber qué hay al otro lado: todo lo que no
          # es local va por la central. Añadir una sede nueva no toca esta línea.
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_wan1_hub }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_control_via }}"
        dhcp_servers:
          - name: sede2
            interface: ether2
            address_pool: "{{ lab_site2_pool }}"
            network: "{{ lab_site2_network }}"
            gateway: "{{ lab_site2_gateway }}"
            dns_server: "{{ lab_site2_gateway }}"
            leases: >-
              {%- set out = [] -%}
              {%- for c in pve_containers
                     | selectattr('site', 'defined')
                     | selectattr('site', 'equalto', 'sede2') -%}
              {%-   set _ = out.append({
                    'address': c.address,
                    'mac_address': c.netif.net0 | regex_replace('^.*hwaddr=([0-9A-Fa-f:]{17}).*$', '\\1'),
                    'comment': c.hostname }) -%}
              {%- endfor -%}
              {{ out }}

  # =========================================================================
  # SEDE 3 — delegación
  # =========================================================================

  - vmid: 165
    name: sw4
    chr: true
    net:
      net0: "virtio=BC:24:11:00:66:01,bridge=vmbr1"     # ether1 gestion
      net1: "virtio=BC:24:11:00:66:02,bridge=vmbr13"    # ether2 -> ws7
      net2: "virtio=BC:24:11:00:66:03,bridge=vmbr14"    # ether3 -> ws8
      net3: "virtio=BC:24:11:00:66:04,bridge=vmbr15"    # ether4 -> rt3
    config:
      routeros:
        identity: sw4
        addresses:
          - address: "10.10.10.165/24"
            interface: ether1
        bridges:
          - name: lan
            ports: [ether2, ether3, ether4]
        dhcp_client: false
        # Puerta de enlace de gestión hacia el router de SU sede (rt3).
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "10.10.10.166"

  - vmid: 166
    name: rt3
    chr: true
    net:
      net0: "virtio=BC:24:11:00:67:01,bridge=vmbr1"     # ether1 gestion
      net1: "virtio=BC:24:11:00:67:02,bridge=vmbr15"    # ether2 -> sw4 (la LAN de la sede)
      net2: "virtio=BC:24:11:00:67:03,bridge=vmbr17"    # ether3 -> WAN 2
    config:
      routeros:
        identity: rt3
        addresses:
          - address: "10.10.10.166/24"
            interface: ether1
          - address: "{{ lab_site3_gateway }}/24"
            interface: ether2
          - address: "{{ lab_wan2_spoke }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_wan2_hub }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_control_via }}"
        dhcp_servers:
          - name: sede3
            interface: ether2
            address_pool: "{{ lab_site3_pool }}"
            network: "{{ lab_site3_network }}"
            gateway: "{{ lab_site3_gateway }}"
            dns_server: "{{ lab_site3_gateway }}"
            leases: >-
              {%- set out = [] -%}
              {%- for c in pve_containers
                     | selectattr('site', 'defined')
                     | selectattr('site', 'equalto', 'sede3') -%}
              {%-   set _ = out.append({
                    'address': c.address,
                    'mac_address': c.netif.net0 | regex_replace('^.*hwaddr=([0-9A-Fa-f:]{17}).*$', '\\1'),
                    'comment': c.hostname }) -%}
              {%- endfor -%}
              {{ out }}

  # ---- plantilla de VM (sin declarar) --------------------------------------
  # - vmid: 120
  #   name: pve-nested
  #   cores: 4
  #   memory: 4096
  #   # Boots the Proxmox VE installer from the ISO already on the node.
  #   status: started
  #   # Opt-out, and the reason the default had to be overridable: the installer
  #   # ISO does not run cloud-init, so a cloud-init drive would be dead weight.
  #   cloudinit: false
  #   net:
  #     # vmbr1 is the internal LAN (10.10.10.0/24) where every other lab guest
  #     # lives. vmbr0 is the PUBLIC bridge (54.36.168.83/24 on eno3): do not put
  #     # a lab guest there unless you mean to expose it to the internet.
  #     net0: "virtio,bridge=vmbr1"
  #   scsi:
  #     scsi0: "local-zfs:32"
