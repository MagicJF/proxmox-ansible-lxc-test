# ============================================================================
# Desired state of every guest this repository manages.
#
# This is the only file that changes when a change is requested: edit it, open a
# branch, run preflight -> apply. The playbooks under playbooks/ are a fixed
# engine (two verbs) and never grow one file per request.
#
# It is a group_vars FILE for the group "all", so variables sit at the top level.
# Nesting them under an "all:" key would define one variable named "all" and
# leave every real variable undefined.
#
# Everything the provisioning module can set is declared here, including the
# settings that must NOT exist (null / empty): absence is state too, so the
# engine deletes anything that appears where the file declares nothing.
# ============================================================================

pve_node: Proxmox

# ============================================================================
# Identidad del laboratorio de conectividad — UNA sola verdad.
#
# Tres consumidores distintos necesitan estos mismos cuatro valores: la
# declaración del CHR (su dirección de gestión y la del segmento del lab), el
# contenedor de bootstrap (la dirección que le concede al CHR en el primer
# arranque), el servidor DHCP del propio CHR (la red y la puerta de enlace) y la
# ruta que el endpoint necesita para llegar al lab. Declararlos una vez aquí es
# lo que evita que se separen.
#
# Las direcciones de las WORKSTATIONS no están aquí: cada una declara la suya en
# su propia entrada (es su identidad en el segmento) y el CHR las deriva.
# ============================================================================
# La pata de gestión del CHR: en la LAN 10.10.10.0/24, como la IP de
# administración de cualquier switch real.
lab_router_mgmt: "10.10.10.50"
# La MAC de su ether1. Fijada porque el bootstrap ata la concesión a ella: es lo
# que hace determinista la primera dirección de un CHR que aún no tiene ninguna.
lab_router_mac: "BC:24:11:00:00:40"
# El segmento del lab, detrás del router.
lab_network: "10.30.0.0/24"
lab_gateway: "10.30.0.1"
# El nombre del bridge de RouterOS: los puertos del switch. Se declara una vez
# porque la dirección del segmento y el servidor DHCP viven EN él, y "bridge" no
# es un nombre de interfaz — la interfaz se llama como se llame este bridge.
lab_bridge_name: "lan"

# ============================================================================
# The automation key every guest is born with — a framework default, not a
# per-guest decision.
#
# PVE's LXC `pubkey` parameter writes this public key into the guest's
# /root/.ssh/authorized_keys AT CREATION. It is a birth-time property: the
# module never forwards it on update, so layer 1 can set it and cannot re-read
# it afterwards, and layer 2 (configure/) is what verifies it from the inside.
#
# The single source of truth is the key FILE, not a copy of its text:
#   pve_ssh_pubkey_path -> the .pub next to the private key used by configure/
# If the file is absent the lookup yields nothing and no key is injected, so a
# clone of this repository without the key still runs (it just has no SSH
# automation until the path is provided).
#
# Opting a single guest out is explicit: declare `pubkey: ""` on that guest.
# ============================================================================
pve_ssh_pubkey_path: "/home/hermes/.hermes/profiles/hermione/secrets/pve-automation_ed25519.pub"

# ============================================================================
# The control node's PATH into the guest LAN — the precondition layer 2 runs on.
#
# The PVE API answers on the public address from anywhere, but the guests live on
# an internal bridge (vmbr1) the control node is not attached to. Layer 2 is SSH,
# so without a path every guest is "unreachable" for a reason that has nothing to
# do with its key. The path is therefore declared here and converged like any
# other resource:
#
#   ansible-playbook playbooks/connect.yml      # converge the path on its own
#   ansible-playbook configure/site.yml         # brings it up AUTOMATICALLY when
#                                               # no guest answers on :22
#
# Keys follow the same rule as the SSH automation key: the private half is a file
# outside the repository (generated here if absent, never printed) and only the
# PUBLIC half travels. Set `manage: false` to get layer 2's plain behaviour when
# this node already routes to the guest LAN.
# ============================================================================
pve_tunnel:
  manage: true
  # Interface name on this node; also the unit name (wg-quick@<name>).
  name: wg-lab
  # The endpoint lives on the lab side. The API cannot configure the Proxmox
  # host, so that half is bootstrapped once with
  # playbooks/tools/wg_endpoint_setup.sh (connect.yml prints the exact command
  # WITH this node's public key when there is no handshake).
  endpoint: "54.36.168.83:51820"
  # The endpoint's public key — public, safe to commit. It is what authenticates
  # the lab side of the tunnel.
  endpoint_public_key: "3+bBS+GqR4EtWUFst+2s49rneVguWquuRBGINt/tZXQ="
  # This node's address inside the tunnel (own /24, never the guest LAN).
  address: "10.99.99.2/24"
  # Only the lab's networks are routed through the tunnel; everything else (the
  # API on its public address) keeps using the normal path. It is a LIST because
  # the lab's guests no longer share one subnet: the workstations live in their
  # sites' networks and are reachable only THROUGH the MikroTik topology, so the
  # control node needs a route into each of them.
  guest_network:
    - "10.10.10.0/24"   # la LAN de gestión (el host y el CHR)
    - "10.30.0.0/24"    # la red del lab: vive DETRÁS del CHR, así que el
                        # endpoint necesita una ruta para ella (abajo)
  # Rutas que el ENDPOINT (el host Proxmox) necesita para entregar el tráfico del
  # túnel a una red que no tiene conectada. Sin ellas el control node alcanza al
  # CHR pero no a las workstations que están detrás: el endpoint manda esos
  # paquetes por su ruta por defecto y mueren en el camino.
  #
  # Es la única línea que hay que pegar a mano, y la aplica el MISMO script que
  # ya se pega una vez (playbooks/tools/wg_endpoint_setup.sh), que la recibe como
  # último argumento. `via` es la dirección de gestión del router de esa red.
  endpoint_routes:
    - to: "{{ lab_network }}"
      via: "{{ lab_router_mgmt }}"
  # No extension, like an SSH key: the public half is this path plus `.pub`.
  private_key_path: "/home/hermes/.hermes/profiles/hermione/secrets/wg-lab-client"
  keepalive: 25

# ============================================================================
# Host-level network segments, created through the PVE API.
#
# These are LINKS, not a switching fabric: each one is a bridge with no ports
# that carries exactly one point-to-point cable between two guests, and nothing
# else. All the switching and routing happens inside the MikroTik CHRs, exactly
# as it would on real hardware — if two guests shared a bridge, Proxmox would be
# doing the switching and the routers would be decoration.
#
# `bridge_ports` empty is what makes a link isolated. Only creation is
# automated: a segment that already exists is left alone, because recreating a
# bridge under a running lab would cut its guests off.
# ============================================================================
pve_bridges:
  # Un cable RJ45, y nada más: cada bridge lleva UN enlace punto a punto entre el
  # router y una workstation. Sin puertos físicos y sin dirección, así que quien
  # conmuta y quien reparte las direcciones es el RouterOS, no Proxmox.
  - iface: vmbr2
    comments: "lab cable: lab-chr ether2 <-> ws1 (isolated, no ports)"
  - iface: vmbr3
    comments: "lab cable: lab-chr ether3 <-> ws2 (isolated, no ports)"
pve_defaults:
  # ---- creation-time: PVE cannot change these on an existing container ------
  # Drift here is refused, not converged: the container would have to be
  # recreated (and rootfs growth cannot be undone at all).
  template: "local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst"
  template_storage: local
  storage: local-zfs
  rootfs_size: 8
  unprivileged: true
  ostype: debian

  # ---- power state ---------------------------------------------------------
  # started | stopped
  status: stopped

  # ---- resources (converged in place) -------------------------------------
  memory: 2048
  swap: 512
  cores: 2
  # cpuunits only: the module's `cpus` parameter means cpuunits on creation but
  # cpulimit on update, so it cannot be declared coherently. Use cpuunits.
  cpuunits: 1024

  # ---- behaviour (converged in place) -------------------------------------
  onboot: false
  description: "Managed by proxmox-ansible-lxc-test. Declare changes in inventory/group_vars/all.yml."
  tags: [ansible-managed, lab]
  # PVE accepts the literal "host" to follow the node's timezone.
  timezone: host
  # tty | console | shell
  cmode: shell
  # List form, joined by the module. Empty list = must not exist.
  features: []
  startup: []

  # ---- network (converged in place; empty = no interface at all) ----------
  netif: {}
  nameserver: null
  searchdomain: null

  # ---- attachments (converged in place; empty = must not exist) -----------
  hookscript: null
  mounts: {}
  mount_devices: []

  # ---- the key at birth (see pve_ssh_pubkey_path above) --------------------
  pubkey: "{{ lookup('file', pve_ssh_pubkey_path, errors='ignore') | default('', true) | trim }}"
  # password: creation-time secret, which would have to live in Git — not
  #           declared; inject it from a vault at creation time if ever needed.
  # clone / clone_type: alternative creation path, unused here.
  # pool: no pool exists on this node.
  # force / purge / destroy_unreferenced_disks: destructive control flags, never
  #           automated by the engine.

# The containers this repository manages — and nothing else. A container absent
# from this list is never read, created or modified.
# vmid + hostname are identity; changing them means "recreate".
# Any key of pve_defaults may be overridden per container.
pve_containers:
  # Observability test container: every attribute below is randomly generated
  # and overrides the defaults. It also proves the key-at-birth default: it was
  # created by this engine, so it has /root/.ssh/authorized_keys already.
  - vmid: 167
    hostname: ct-forge-5f2a
    rootfs_size: 7
    cores: 5
    memory: 2560
    swap: 896
    cpuunits: 512
    onboot: true
    status: started
    cmode: tty
    timezone: host
    tags: [canary, lab, tier1]
    description: "Generated by the observability test at 2026-11-04; every attribute below is random."
    features: []
    startup: []
    nameserver: 9.9.9.9
    searchdomain: null
    netif:
      net0: "name=eth0,bridge=vmbr0,ip=dhcp"
    mounts:
      mp0: "local:5,mp=/mnt/data"

  # TiddlyWiki service. Layer 1 owns the guest's shape; layer 2 owns the wiki,
  # its dependencies and the unit that serves it on every boot.
  - vmid: 131
    hostname: wiki-tiddly
    cores: 1
    memory: 1024
    rootfs_size: 6
    swap: 512
    status: started
    tags: [wiki, lab]
    description: "TiddlyWiki server: shape owned by layer 1, the wiki and its service owned by layer 2."
    netif:
      # Static on the LAN bridge: layer 2 derives the SSH target from here, and a
      # DHCP-only guest cannot be reached (nor can its URL be declared once).
      net0: "name=eth0,bridge=vmbr1,gw=10.10.10.1,ip=10.10.10.31/24,ip6=auto"

    # ---- layer 2 (configure/). Layer 1 ignores the `config` block. -----------
    manage: true
    config:
      tiddlywiki:
        wiki_dir: /srv/tiddlywiki
        port: 8080
        # Pinned on purpose: a rebuild must install the same wiki engine. This is
        # the version published as `latest` on npm when the guest was declared.
        version: "5.4.1"
        service_user: tiddlywiki
        # Where it binds. 0.0.0.0 makes it reachable from the LAN (the point of
        # serving it) — a TiddlyWiki server edition is writable and
        # unauthenticated, so this is an explicit exposure decision and the guest
        # must stay on a network that is not public.
        listen_host: "0.0.0.0"
      # Proof from OUTSIDE the guest, asserted after convergence: the declaration
      # says which status and body the URL must answer.
      http:
        - address: ":8080"
          expect_status: 200
          expect_body: "TiddlyWiki"

  # ---------------------------------------------------------------------------
  # El laboratorio de conectividad: dos workstations y el switch que las une.
  #
  # Cada workstation es un PC: UNA sola NIC, sin interfaz de gestión, en su
  # propio bridge aislado — el latiguillo RJ45 que la une al switch. Su dirección
  # la reparte el propio RouterOS por DHCP, como en cualquier red real, y por eso
  # layer 2 no puede derivarla de un `net0` estático: se declara aquí como la
  # dirección que el switch le RESERVA, y el CHR la deriva de esta entrada.
  #
  # La MAC va declarada en el net0 porque es lo que ata la reserva a la interfaz:
  # una sola verdad, no dos. PVE la respeta al crear la LXC.
  # ---------------------------------------------------------------------------
  - vmid: 141
    hostname: ws1
    cores: 1
    memory: 512
    rootfs_size: 6
    swap: 256
    status: started
    tags: [netlab, workstation, lab]
    description: "Workstation 1: una sola NIC en el cable hacia el CHR. Sin interfaz de gestión, como un PC."
    # La dirección que el CHR le reserva por MAC. La usan el servidor DHCP del
    # router (la concesión) y layer 2 (dónde hablarle por SSH).
    address: "10.30.0.11"
    netif:
      net0: "name=eth0,bridge=vmbr2,hwaddr=BC:24:11:00:00:51,ip=dhcp"
    manage: true
    config:
      netlab:
        # La prueba del lab: alcanzar a la otra workstation cruzando el switch.
        # No hay rutas que declarar — la puerta de enlace por defecto la trae el
        # propio DHCP del CHR.
        peers: ["10.30.0.12"]

  - vmid: 142
    hostname: ws2
    cores: 1
    memory: 512
    rootfs_size: 6
    swap: 256
    status: started
    tags: [netlab, workstation, lab]
    description: "Workstation 2: una sola NIC en el cable hacia el CHR. Sin interfaz de gestión, como un PC."
    address: "10.30.0.12"
    netif:
      net0: "name=eth0,bridge=vmbr3,hwaddr=BC:24:11:00:00:52,ip=dhcp"
    manage: true
    config:
      netlab:
        peers: ["10.30.0.11"]

  # ---------------------------------------------------------------------------
  # El bootstrap del CHR: el único punto que la API de PVE no puede resolver.
  #
  # Un CHR recién importado arranca SIN dirección (sólo un cliente DHCP en
  # ether1) y, al ser una VM, no puede tomar una concesión del DHCP del host: la
  # oferta llega con un checksum de UDP que el kernel del invitado descarta (está
  # medido en este lab). Sin dirección no hay API REST, así que hace falta algo
  # que le dé la primera.
  #
  # Este contenedor es ese algo: vive en la MISMA pata de gestión que el CHR,
  # corre dnsmasq atado a la MAC de su ether1 y con el offload de TX desactivado
  # (sin eso su propia oferta tendría el mismo checksum roto), y concede
  # exactamente una dirección: la de gestión del CHR. A partir de ahí todo lo
  # demás lo hace la API REST, y este contenedor no vuelve a intervenir.
  #
  # Dirección estática a propósito: es infraestructura, no una workstation, y
  # layer 2 tiene que poder entrar a configurarla antes de que el lab exista.
  # ---------------------------------------------------------------------------
  - vmid: 143
    hostname: lab-bootstrap
    cores: 1
    # 1 GiB, not 256 MiB: apt on Debian 13 gets OOM-killed below ~512 MiB, and
    # this guest exists to install dnsmasq once and then sit still.
    memory: 1024
    rootfs_size: 4
    swap: 256
    status: started
    tags: [netlab, bootstrap, lab]
    description: "Concede al CHR su primera dirección por DHCP (atada a su MAC) para que la API REST exista. No hace nada más."
    netif:
      net0: "name=eth0,bridge=vmbr1,gw=10.10.10.1,ip=10.10.10.53/24"
    manage: true
    config:
      bootstrap:
        interface: eth0
        # La MAC que pide la dirección y la dirección que se le concede salen de
        # la identidad del lab (arriba): no se repiten.
        lease_mac: "{{ lab_router_mac }}"
        lease_address: "{{ lab_router_mgmt }}"

# ============================================================================
# QEMU VMs — same declarative rules as the containers, with one important
# difference: proxmox_kvm refuses to update net/scsi/ide/sata/virtio (updating
# them can regenerate a MAC or recreate a disk), so for a VM those, plus
# bios/machine/scsihw/ostype, are creation-time: drift in them is REFUSED by
# apply.yml instead of converged.
# ============================================================================
pve_vm_defaults:
  # ---- creation-time: PVE cannot change these on an existing VM --------
  bios: seabios
  machine: q35
  scsihw: virtio-scsi-single
  ostype: l26

  # ---- power state ----------------------------------------------------
  # started | stopped
  status: stopped

  # ---- resources and behaviour (converged in place) --------------------
  sockets: 1
  cpu: host
  vga: std
  onboot: false
  boot: "order=ide2;scsi0"
  description: "Nested Proxmox VE managed by proxmox-ansible-lxc-test. The installation itself is finished by hand from the noVNC console."
  tags: [nested, pve, ansible-managed]

  # ---- attachments (creation-time; empty = must not exist) -------------
  net: {}
  scsi: {}
  sata: {}
  ide: {}
  virtio: {}

  # ---- the key at birth, for cloud-init capable images -----------------
  # A container gets its key through `pubkey`; a VM has no equivalent, so the
  # framework uses the same key through cloud-init: a cloud-init drive plus
  # `ciuser`/`sshkeys`. Both are creation-time (the drive is an `ide2` disk,
  # which proxmox_kvm refuses to update).
  #
  # It is ON by default because every VM this framework creates should be born
  # reachable, and OFF for an image that does not run cloud-init — the Proxmox
  # VE installer ISO, for instance, would never read it. Declaring
  # `cloudinit: false` on such a guest is the explicit opt-out.
  cloudinit: true
  cloudinit_storage: local-zfs
  ciuser: root
  sshkeys: "{{ pve_defaults.pubkey }}"
  # ipconfig0/config0 would move the VM's addressing into cloud-init; the
  # framework keeps addressing where it already lives (the `net` value) to have
  # one home for it.

# ---- CHR (MikroTik RouterOS) defaults ---------------------------------------
# Shared by every router of the network lab. They sit ON TOP of pve_vm_defaults
# (which describe the nested PVE guest) and apply only to entries declaring
# `chr: true`, so the vendor image, the boot order and the console live in one
# block instead of five copies.
pve_chr_defaults:
  cores: 2
  memory: 512
  status: started
  manage: true
  # The vendor image has no cloud-init, so the drive would be dead weight.
  cloudinit: false
  # CHR is an i440fx-era image: it boots on the PC chipset, not on q35.
  machine: pc
  # The imported image is the only disk, so it must be the boot device (the
  # default order expects the cloud-init drive this VM does not have).
  boot: "order=scsi0"
  tags: [netlab, routeros, lab]
  scsi:
    scsi0: "local-zfs:8"
  # The vendor image, imported instead of created: proxmox_kvm can only build a
  # disk from a size, so the raw image is uploaded to a storage that accepts
  # `import` and attached with the API's creation-time import-from syntax (see
  # playbooks/tasks/disk_import.yml). `key` is the disk the image fills.
  disk_import:
    - key: scsi0
      source: "local:import/chr-7.25.1.raw"
  # The console that respects a non-US keyboard: it carries CHARACTERS, not
  # scancodes. `vga: serial0` is what makes PVE's Console button open it — with
  # a VGA adapter the button opens noVNC and the port is only reachable from a
  # node shell. The trade-off, stated plainly: no screen, so the boot phase
  # shows nothing until RouterOS prints its prompt.
  serial:
    serial0: socket
  vga: serial0
  # NO `keyboard:` — deliberately. It only sets how the VNC server turns the
  # browser's keys into scancodes, and the LAST translation is the guest's own
  # console keymap, which in RouterOS is US with no setting to change it.

# The VMs this repository manages — and nothing else.
pve_vms:
  # ---------------------------------------------------------------------------
  # El switch/router del lab: un MikroTik RouterOS CHR.
  #
  # Tres puertos, y cada uno es un cable:
  #   ether1 -> vmbr1   la pata de GESTIÓN. Todo switch real tiene su dirección
  #                     de administración; sin ella no habría forma de
  #                     configurarlo ni de llegar al lab.
  #   ether2 -> vmbr2   el cable hacia ws1
  #   ether3 -> vmbr3   el cable hacia ws2
  # ether2 y ether3 van al MISMO bridge de RouterOS: eso ES el switch. ether1
  # queda fuera, como el puerto de consola/gestión de un switch.
  #
  # Todo lo de dentro (bridge, direcciones, DHCP con reservas) se declara en
  # `config.routeros` y lo converge configure/roles/routeros hablando con la API
  # REST del router — nunca por SSH ni por la API binaria.
  #
  # Las NICs de una VM son creation-time (proxmox_kvm no las actualiza), así que
  # las MACs quedan fijadas aquí: la de ether1 es la que el bootstrap usa para
  # concederle la primera dirección.
  # ---------------------------------------------------------------------------
  - vmid: 140
    name: lab-chr
    chr: true
    net:
      net0: "virtio={{ lab_router_mac }},bridge=vmbr1"
      net1: "virtio=BC:24:11:00:00:41,bridge=vmbr2"
      net2: "virtio=BC:24:11:00:00:42,bridge=vmbr3"
    config:
      routeros:
        identity: lab-chr
        # Direcciones estáticas. La de ether1 es la de gestión — la misma que el
        # bootstrap le concede por DHCP en el primer arranque, para que la API
        # REST exista. La del bridge es la puerta de enlace del lab.
        addresses:
          - address: "{{ lab_router_mgmt }}/24"
            interface: ether1
          - address: "{{ lab_gateway }}/24"
            interface: "{{ lab_bridge_name }}"
        # El switch: estos dos puertos van al mismo bridge de RouterOS.
        bridges:
          - name: "{{ lab_bridge_name }}"
            ports: [ether2, ether3]
        # Un CHR de fábrica trae un cliente DHCP en ether1. Con una dirección
        # estática declarada, ese cliente es drift y se elimina.
        dhcp_client: false
        dhcp_servers:
          - name: lab
            interface: "{{ lab_bridge_name }}"
            address_pool: "10.30.0.10-10.30.0.254"
            network: "{{ lab_network }}"
            gateway: "{{ lab_gateway }}"
            dns_server: "{{ lab_gateway }}"
            # Una reserva por workstation. La dirección y la MAC salen de la
            # declaración de la propia workstation (arriba): la MAC de su net0 y
            # su `address:`. Aquí no se repite ningún valor.
            leases: >-
              {%- set out = [] -%}
              {%- for c in pve_containers
                     | selectattr('address', 'defined')
                     | selectattr('netif', 'defined') -%}
              {%- set _ = out.append({
                    'address': c.address,
                    'mac_address': c.netif.net0 | regex_replace('^.*hwaddr=([0-9A-Fa-f:]{17}).*$', '\\1'),
                    'comment': c.hostname }) -%}
              {%- endfor -%}
              {{ out }}
  # ---- plantilla de VM (sin declarar) --------------------------------------
  # - vmid: 120
  #   name: pve-nested
  #   cores: 4
  #   memory: 4096
  #   # Boots the Proxmox VE installer from the ISO already on the node.
  #   status: started
  #   # Opt-out, and the reason the default had to be overridable: the installer
  #   # ISO does not run cloud-init, so a cloud-init drive would be dead weight.
  #   cloudinit: false
  #   net:
  #     # vmbr1 is the internal LAN (10.10.10.0/24) where every other lab guest
  #     # lives. vmbr0 is the PUBLIC bridge (54.36.168.83/24 on eno3): do not put
  #     # a lab guest there unless you mean to expose it to the internet.
  #     net0: "virtio,bridge=vmbr1"
  #   scsi:
  #     scsi0: "local-zfs:32"
  #   ide:
  #     ide2: "local:iso/proxmox-ve_9.2-1.iso,media=cdrom"

# ============================================================================
# Layer 2 — configuration targets (guest-side, over SSH).
#
# Layer 1 NEVER reads this list. These guests are configured from the inside by
# configure/*.yml while their PVE shape stays unmanaged by this repository:
# partial adoption, stated explicitly rather than implied.
#
# `manage: false` means "read only": configure/audit.yml inspects the guest and
# changes nothing. Converging it is a separate, deliberate step, and the flag is
# the switch — a guest is never configured by accident.
#
# When you decide to adopt a guest fully, move its entry into pve_containers with
# its shape declared faithfully; do not keep it in both lists.
# ============================================================================
pve_config_targets:
  - vmid: 101
    hostname: caddy
    address: 10.10.10.2
    manage: false
