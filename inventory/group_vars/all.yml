# ============================================================================
# Layer 2 — configuration targets (guest-side, over SSH).
#
# Layer 1 NEVER reads this list. These guests are configured from the inside by
# configure/*.yml while their PVE shape stays unmanaged by this repository:
# partial adoption, stated explicitly rather than implied.
#
# `manage: false` means "read only": configure/audit.yml inspects the guest and
# changes nothing. Converging it is a separate, deliberate step, and the flag is
# the switch — a guest is never configured by accident.
#
# When you decide to adopt a guest fully, move its entry into pve_containers with
# its shape declared faithfully; do not keep it in both lists.
# ============================================================================
pve_config_targets:
  - vmid: 101
    hostname: caddy
    address: 10.10.10.2
    manage: false

# ============================================================================
# Retención de logs/ — el ÚNICO directorio del repositorio que crece solo.
#
# Ansible solo sabe AÑADIR a su `log_path`: nunca lo rota, así que un fichero
# acumula todas las ejecuciones para siempre. La política tiene dos mitades, y
# hacen falta las dos: un fichero vivo que pasa de `live_max_mb` se rota a
# logs/archive/ y se vacía (acota cada fichero), y los archivos con más de
# `keep_days` o más allá de `keep_count` se borran (acota el directorio).
#
# La aplica el propio framework, en cada verbo y antes de tocar nada, así que un
# lab que solo se maneja con los verbos nunca necesita un operador. Para el caso
# contrario —nadie ejecuta el framework en días— el mismo script vale suelto:
#
#   python3 playbooks/tools/logs_prune.py --dry-run
#   python3 playbooks/tools/logs_prune.py
#
# El archivo más reciente NUNCA se borra, diga lo que diga `keep_count`: es el
# que alguien iría a mirar. Con los valores de abajo el techo es 10 × 8 MB.
# ============================================================================
# Cuánto se espera, como máximo, a que un escalón entero acabe en marcha. El lote se
# pide de golpe y se relanza lo que quede parado, así que este margen cubre la
# petición más un par de reintentos; agotarlo hace fallar la tarea diciendo qué vmid
# no arrancó y en qué estado quedó.
pve_power_start_timeout: 240

# Margen de cortesía entre un escalón y el siguiente, en segundos. La clave es el
# `order` del escalón que ACABA de arrancar. Sólo lo usa lo que no tiene una señal
# propia que consultar (el bootstrap): los equipos de red esperan a que su API
# conteste de verdad, y un margen ciego que no comprueba nada es peor que una
# comprobación.
pve_power_gap_after:
  1: 10

# Cuánto se espera, como máximo, a que un escalón de RouterOS levante de verdad y
# conteste su API (`playbooks/tools/routeros_wait.py`). La tarea de arranque de
# Proxmox acaba cuando ha DADO la orden, no cuando el invitado está listo: un CHR
# tarda decenas de segundos en levantar RouterOS, y hasta entonces no sirve el DHCP
# del que depende el escalón siguiente.
pve_power_ready_timeout: 180

pve_log_retention:
  live_max_mb: 8
  keep_days: 14
  keep_count: 10
