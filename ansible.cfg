[defaults]
# Fewer output lines: skipped tasks are noise on a large run.
display_skipped_hosts = False
# Guests are independent; raise parallelism if the manifest grows.
forks = 20

inventory = inventory/hosts.yml
retry_files_enabled = False
interpreter_python = auto_silent

# Engine plugins shared by both layers (playbooks/ and configure/). Ansible
# otherwise only looks next to the playbook, which would hide the filters
# from whichever layer runs second. Resolved relative to this file.
filter_plugins = filter_plugins

# Human-readable log of every run, appended (never rotated by Ansible itself).
# Contains the full play output; task results from the API tasks stay censored
# because they carry no_log, so the token never lands here. The machine-readable
# API journal is written separately by playbooks/tracing/sitecustomize.py.
# Run ansible-playbook from the repository root for this relative path to land
# in ./logs/.
log_path = logs/ansible.log

[ssh_connection]
# Reuse ONE ssh connection for all the tasks of a guest instead of establishing a
# new one per task, and stream modules over it instead of copying them.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ControlPath=/tmp/ansible-ssh-%h-%p-%r -o StrictHostKeyChecking=accept-new

