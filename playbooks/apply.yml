---
- name: Converge every container declared in inventory/group_vars/all.yml
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/state.yml
  vars:
    # Credentials. When playbooks/vars/secrets.yml exists its hardcoded values
    # win (load_vars in pre_tasks); otherwise these environment fallbacks apply.
    pve_api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    pve_api_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
    pve_api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
    pve_api_ca_path: "{{ lookup('env', 'PROXMOX_CA_PATH') }}"
    pve_auth: &pve_auth
      api_host: "{{ pve_api_host }}"
      api_port: 8006
      api_user: root@pam
      api_token_id: "{{ pve_api_token_id }}"
      api_token_secret: "{{ pve_api_token_secret }}"
      ca_path: "{{ pve_api_ca_path }}"
      validate_certs: true
      api_timeout: 300
    pve_loop: &pve_loop
      loop_var: ct
      index_var: idx
      label: "VMID {{ ct.vmid }}"
    # Observability: every run appends to a human log (ansible.cfg log_path) and
    # to a machine-readable journal of the real PVE API traffic.
    pve_log_dir: "{{ playbook_dir }}/../logs"
    pve_journal: "{{ playbook_dir }}/../logs/pve-api.jsonl"
  # Arming the tracer: PYTHONPATH makes CPython import playbooks/tracing/sitecustomize.py
  # in every module process, which then journals each HTTP call to PVE.
  environment:
    PYTHONPATH: "{{ playbook_dir }}/tracing"
    PVE_HTTP_TRACE: "{{ pve_log_dir }}/pve-api.jsonl"
  pre_tasks:
    - name: Look for the local credentials file
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/vars/secrets.yml"
      register: pve_secrets_file

    - name: Load the hardcoded local credentials when present (gitignored)
      ansible.builtin.include_vars:
        file: vars/secrets.yml
      when: pve_secrets_file.stat.exists

    - name: Refuse an inaccurate dry-run
      ansible.builtin.fail:
        msg: >-
          community.proxmox.proxmox declares supports_check_mode=False, so --check only skips the
          mutating task and predicts nothing. Run playbooks/preflight.yml for the read-only diff.
          No changes were made.
      when: ansible_check_mode

    - name: Read the repository revision for the run header
      ansible.builtin.command:
        cmd: git rev-parse --short HEAD
        chdir: "{{ playbook_dir }}/.."
      register: pve_rev
      changed_when: false
      failed_when: false

    - name: Mark the start of this run in the API journal
      ansible.builtin.lineinfile:
        path: "{{ pve_journal }}"
        line: "{{ run_start | to_json }}"
        create: true
        mode: "0600"
      vars:
        run_start:
          ts: "{{ '%Y-%m-%dT%H:%M:%S%z' | strftime }}"
          event: run_start
          playbook: "{{ ansible_play_name }}"
          revision: "{{ pve_rev.stdout | default('unknown', true) }}"
          containers: "{{ pve_containers | map(attribute='vmid') | list }}"
      changed_when: false

    - name: Remember the journal size so this run can prove it was traced
      ansible.builtin.stat:
        path: "{{ pve_journal }}"
      register: pve_journal_start

  tasks:
    - name: Build the effective spec of every declared container
      ansible.builtin.set_fact:
        pve_cts: "{{ (pve_cts | default([])) + [pve_defaults | combine(item)] }}"
      loop: "{{ pve_containers }}"
      loop_control:
        label: "VMID {{ item.vmid }}"

    - name: Reject a power state the module cannot converge to
      ansible.builtin.assert:
        that:
          - ct.status in ['started', 'stopped']
        fail_msg: "{{ ct.hostname }} (VMID {{ ct.vmid }}): status must be 'started' or 'stopped', not '{{ ct.status }}'."
      loop: "{{ pve_cts }}"
      loop_control: *pve_loop
      run_once: false

    - name: Read every declared container through the API
      community.proxmox.proxmox_vm_info:
        <<: *pve_auth
        vmid: "{{ ct.vmid }}"
        type: lxc
        config: current
      loop: "{{ pve_cts }}"
      loop_control: *pve_loop
      register: live_cts
      no_log: true

    - name: Analyse every declared container against its live state
      ansible.builtin.set_fact:
        pve_eval: "{{ pve_eval | default({}) | combine({ (ct.vmid | string): analysis }) }}"
      vars:
        vm: "{{ live_cts.results[idx].proxmox_vms | first | default({}, true) }}"
        live: "{{ vm.config | default({}, true) }}"
        live_status: "{{ vm.status | default('', true) }}"
        analysis: "{{ pve_analysis }}"
        # feed the shared difference engine with the container mapping
        declared_norm: "{{ pve_lxc_declared_norm }}"
        actual_norm: "{{ pve_lxc_actual_norm }}"
        pve_undeclared_child_keys: "{{ pve_lxc_undeclared_child_keys }}"
        pve_creation_time_drift: "{{ pve_lxc_creation_time_drift }}"
      loop: "{{ pve_cts }}"
      loop_control: *pve_loop

    # Creation-time properties cannot be converged in place. Fail loudly for that
    # container rather than reporting a success the API never applied.
    - name: Refuse to converge properties PVE cannot change on an existing container
      ansible.builtin.assert:
        that:
          - a.creation_time_drift | length == 0
        fail_msg: >-
          {{ ct.hostname }} (VMID {{ ct.vmid }}):
          {{ a.creation_time_drift | join(', ') }} differs from the live container. PVE cannot apply
          it in place and growing a rootfs is irreversible, so this container is left untouched.
          Recreate it deliberately or revert the value.
        success_msg: "{{ ct.hostname }} (VMID {{ ct.vmid }}): creation-time properties match."
      vars:
        a: "{{ pve_eval[ct.vmid | string] }}"
      loop: "{{ pve_cts }}"
      loop_control: *pve_loop
      when: a.exists

    - name: Create the containers that do not exist yet
      community.proxmox.proxmox:
        <<: *pve_auth
        node: "{{ pve_node }}"
        vmid: "{{ ct.vmid }}"
        hostname: "{{ ct.hostname }}"
        ostype: "{{ ct.ostype }}"
        ostemplate: "{{ ct.template }}"
        storage: "{{ ct.storage }}"
        disk: "{{ ct.storage }}:{{ ct.rootfs_size }}"
        cores: "{{ ct.cores }}"
        memory: "{{ ct.memory }}"
        swap: "{{ ct.swap }}"
        cpuunits: "{{ ct.cpuunits }}"
        unprivileged: "{{ ct.unprivileged | bool }}"
        onboot: "{{ ct.onboot | bool }}"
        cmode: "{{ ct.cmode | default(omit, true) }}"
        timezone: "{{ ct.timezone | default(omit, true) }}"
        description: "{{ ct.description | default(omit, true) }}"
        tags: "{{ ct.tags | default(omit, true) }}"
        features: "{{ ct.features if (ct.features | default([], true)) else omit }}"
        startup: "{{ ct.startup if (ct.startup | default([], true)) else omit }}"
        nameserver: "{{ ct.nameserver | default(omit, true) }}"
        searchdomain: "{{ ct.searchdomain | default(omit, true) }}"
        hookscript: "{{ ct.hookscript | default(omit, true) }}"
        netif: "{{ ct.netif if (ct.netif | default({}, true)) else omit }}"
        mounts: "{{ ct.mounts if (ct.mounts | default({}, true)) else omit }}"
        mount_devices: "{{ ct.mount_devices if (ct.mount_devices | default([], true)) else omit }}"
        timeout: 120
        state: present
      loop: "{{ pve_cts }}"
      loop_control: *pve_loop
      register: create_result
      no_log: true
      when: not (pve_eval[ct.vmid | string].exists)

    # Only the keys that actually drifted are sent: the module PUTs every
    # parameter it receives, not just the ones it found different.
    - name: Converge the settings that drifted on the existing containers
      community.proxmox.proxmox:
        <<: *pve_auth
        node: "{{ pve_node }}"
        vmid: "{{ ct.vmid }}"
        hostname: "{{ ct.hostname }}"
        cores: "{{ ct.cores if 'cores' in a.to_set else omit }}"
        memory: "{{ ct.memory if 'memory' in a.to_set else omit }}"
        swap: "{{ ct.swap if 'swap' in a.to_set else omit }}"
        cpuunits: "{{ ct.cpuunits if 'cpuunits' in a.to_set else omit }}"
        onboot: "{{ (ct.onboot | bool) if 'onboot' in a.to_set else omit }}"
        cmode: "{{ ct.cmode if 'cmode' in a.to_set else omit }}"
        timezone: "{{ ct.timezone if 'timezone' in a.to_set else omit }}"
        description: "{{ ct.description if 'description' in a.to_set else omit }}"
        tags: "{{ ct.tags if 'tags' in a.to_set else omit }}"
        features: "{{ ct.features if 'features' in a.to_set else omit }}"
        startup: "{{ ct.startup if 'startup' in a.to_set else omit }}"
        nameserver: "{{ ct.nameserver if 'nameserver' in a.to_set else omit }}"
        searchdomain: "{{ ct.searchdomain if 'searchdomain' in a.to_set else omit }}"
        hookscript: "{{ ct.hookscript if 'hookscript' in a.to_set else omit }}"
        netif: >-
          {{ ct.netif if ((ct.netif | default({}, true)).keys() | list | intersect(a.to_set) | length > 0) else omit }}
        mounts: >-
          {{ ct.mounts if ((ct.mounts | default({}, true)).keys() | list | intersect(a.to_set) | length > 0) else omit }}
        delete: "{{ a.to_delete if a.to_delete else omit }}"
        update: true
        state: present
      vars:
        a: "{{ pve_eval[ct.vmid | string] }}"
      loop: "{{ pve_cts }}"
      loop_control: *pve_loop
      register: converge_result
      no_log: true
      when: a.exists and ((a.to_set | length > 0) or (a.to_delete | length > 0))

    - name: Converge the power state of every container
      community.proxmox.proxmox:
        <<: *pve_auth
        node: "{{ pve_node }}"
        vmid: "{{ ct.vmid }}"
        timeout: 90
        state: "{{ ct.status }}"
      loop: "{{ pve_cts }}"
      loop_control: *pve_loop
      register: power_result
      no_log: true
      when: pve_eval[ct.vmid | string].power_drift

    - name: Report what this run changed
      ansible.builtin.debug:
        msg: >-
          {{ ct.hostname }} (VMID {{ ct.vmid }}): set {{ a.to_set | join(', ') or '-' }},
          delete {{ a.to_delete | join(', ') or '-' }},
          power {{ a.status or '(none)' }} -> {{ a.status_expected }}
      vars:
        a: "{{ pve_eval[ct.vmid | string] }}"
      changed_when: false
      loop: "{{ pve_cts }}"
      loop_control: *pve_loop

    - name: Re-read every declared container through the API
      community.proxmox.proxmox_vm_info:
        <<: *pve_auth
        vmid: "{{ ct.vmid }}"
        type: lxc
        config: current
      loop: "{{ pve_cts }}"
      loop_control: *pve_loop
      register: applied_cts
      no_log: true

    - name: Re-analyse every container from the fresh API read
      ansible.builtin.set_fact:
        pve_after: "{{ pve_after | default({}) | combine({ (ct.vmid | string): analysis }) }}"
      vars:
        vm: "{{ applied_cts.results[idx].proxmox_vms | first | default({}, true) }}"
        live: "{{ vm.config | default({}, true) }}"
        live_status: "{{ vm.status | default('', true) }}"
        analysis: "{{ pve_analysis }}"
        # feed the shared difference engine with the container mapping
        declared_norm: "{{ pve_lxc_declared_norm }}"
        actual_norm: "{{ pve_lxc_actual_norm }}"
        pve_undeclared_child_keys: "{{ pve_lxc_undeclared_child_keys }}"
        pve_creation_time_drift: "{{ pve_lxc_creation_time_drift }}"
      loop: "{{ pve_cts }}"
      loop_control: *pve_loop

    # The verification re-derives everything from a fresh API read: a task exit
    # status is not proof that PVE stored what was declared.
    - name: Verify every container matches the declared state
      ansible.builtin.assert:
        that:
          - b.exists
          - b.mismatched | length == 0
          - b.forbidden_present | length == 0
          - b.creation_time_drift | length == 0
          - not b.power_drift
        fail_msg: >-
          {{ ct.hostname }} (VMID {{ ct.vmid }}) does not match inventory/group_vars/all.yml after
          apply: mismatched={{ b.declared_subset | to_json }} vs live={{ b.actual_subset | to_json }},
          still present but declared absent={{ b.forbidden_present | join(', ') or '-' }},
          creation-time drift={{ b.creation_time_drift | join(', ') or '-' }},
          status {{ b.status }} vs declared {{ b.status_expected }}.
        success_msg: >-
          Verified {{ ct.hostname }} (VMID {{ ct.vmid }}): {{ ct.cores }} vCPU, {{ ct.memory }} MiB RAM,
          {{ ct.swap }} MiB swap, cpuunits {{ ct.cpuunits }}, {{ b.status }},
          rootfs {{ ct.rootfs_size }} GiB on {{ ct.storage }}, and every declared setting matches.
      vars:
        b: "{{ pve_after[ct.vmid | string] }}"
      loop: "{{ pve_cts }}"
      loop_control: *pve_loop

    # =======================================================================
    # QEMU VMs — same two verbs as for containers, with the VM mapping from
    # playbooks/vars/state.yml. The module refuses to update net/scsi/ide/sata/
    # virtio, so those are creation-time here: drift in them is refused.
    # =======================================================================

    - name: Build the effective spec of every declared VM
      ansible.builtin.set_fact:
        pve_vm_specs: "{{ (pve_vm_specs | default([])) + [pve_vm_defaults | combine(item)] }}"
      loop: "{{ pve_vms }}"
      loop_control:
        label: "VMID {{ item.vmid }}"

    - name: Read every declared VM through the API
      community.proxmox.proxmox_vm_info:
        <<: *pve_auth
        vmid: "{{ ct.vmid }}"
        type: qemu
        config: current
      loop: "{{ pve_vm_specs }}"
      loop_control: *pve_loop
      register: live_vms
      no_log: true

    - name: Analyse every declared VM against its live state
      ansible.builtin.set_fact:
        pve_vm_eval: "{{ pve_vm_eval | default({}) | combine({ (ct.vmid | string): analysis }) }}"
      vars:
        ga: "{{ live_vms.results[idx].proxmox_vms | first | default({}, true) }}"
        live: "{{ ga.config | default({}, true) }}"
        live_status: "{{ ga.status | default('', true) }}"
        analysis: "{{ pve_analysis }}"
        # feed the shared difference engine with the VM mapping
        declared_norm: "{{ pve_vm_declared_norm }}"
        actual_norm: "{{ pve_vm_actual_norm }}"
        pve_undeclared_child_keys: "{{ pve_vm_undeclared_child_keys }}"
        pve_creation_time_drift: "{{ pve_vm_creation_time_drift }}"
      loop: "{{ pve_vm_specs }}"
      loop_control: *pve_loop

    - name: Refuse to converge VM properties PVE cannot change on a running VM definition
      ansible.builtin.assert:
        that:
          - a.creation_time_drift | length == 0
        fail_msg: >-
          {{ ct.name }} (VMID {{ ct.vmid }}): {{ a.creation_time_drift | join(', ') }} differs from
          the live VM. proxmox_kvm refuses to update net/scsi/ide/sata/virtio (it can regenerate a
          MAC or recreate a disk) and bios/machine/scsihw/ostype are creation-time, so this VM is
          left untouched. Recreate it deliberately or revert the value.
        success_msg: "{{ ct.name }} (VMID {{ ct.vmid }}): creation-time properties match."
      vars:
        a: "{{ pve_vm_eval[ct.vmid | string] }}"
      loop: "{{ pve_vm_specs }}"
      loop_control: *pve_loop
      when: a.exists

    - name: Create the VMs that do not exist yet
      community.proxmox.proxmox_kvm:
        <<: *pve_auth
        node: "{{ pve_node }}"
        vmid: "{{ ct.vmid }}"
        name: "{{ ct.name }}"
        cores: "{{ ct.cores }}"
        sockets: "{{ ct.sockets }}"
        memory: "{{ ct.memory }}"
        cpu: "{{ ct.cpu }}"
        ostype: "{{ ct.ostype }}"
        bios: "{{ ct.bios }}"
        machine: "{{ ct.machine }}"
        scsihw: "{{ ct.scsihw }}"
        vga: "{{ ct.vga }}"
        onboot: "{{ ct.onboot | bool }}"
        boot: "{{ ct.boot }}"
        description: "{{ ct.description | default(omit, true) }}"
        tags: "{{ ct.tags | default(omit, true) }}"
        kvm: true
        net: "{{ ct.net }}"
        scsi: "{{ ct.scsi }}"
        ide: "{{ ct.ide }}"
        timeout: 300
        state: present
      loop: "{{ pve_vm_specs }}"
      loop_control: *pve_loop
      register: vm_create
      no_log: true
      when: not (pve_vm_eval[ct.vmid | string].exists)

    # Only the properties proxmox_kvm is willing to update, and only the ones
    # that actually drifted.
    - name: Converge the settings that drifted on the existing VMs
      community.proxmox.proxmox_kvm:
        <<: *pve_auth
        node: "{{ pve_node }}"
        vmid: "{{ ct.vmid }}"
        name: "{{ ct.name }}"
        cores: "{{ ct.cores if 'cores' in a.to_set else omit }}"
        sockets: "{{ ct.sockets if 'sockets' in a.to_set else omit }}"
        memory: "{{ ct.memory if 'memory' in a.to_set else omit }}"
        cpu: "{{ ct.cpu if 'cpu' in a.to_set else omit }}"
        vga: "{{ ct.vga if 'vga' in a.to_set else omit }}"
        boot: "{{ ct.boot if 'boot' in a.to_set else omit }}"
        onboot: "{{ (ct.onboot | bool) if 'onboot' in a.to_set else omit }}"
        description: "{{ ct.description if 'description' in a.to_set else omit }}"
        tags: "{{ ct.tags if 'tags' in a.to_set else omit }}"
        update: true
        timeout: 300
        state: present
      vars:
        a: "{{ pve_vm_eval[ct.vmid | string] }}"
      loop: "{{ pve_vm_specs }}"
      loop_control: *pve_loop
      register: vm_converge
      no_log: true
      when: a.exists and (a.to_set | length > 0)

    - name: Converge the power state of every declared VM
      community.proxmox.proxmox_kvm:
        <<: *pve_auth
        node: "{{ pve_node }}"
        vmid: "{{ ct.vmid }}"
        timeout: 300
        state: "{{ ct.status }}"
      loop: "{{ pve_vm_specs }}"
      loop_control: *pve_loop
      register: vm_power
      no_log: true
      when: pve_vm_eval[ct.vmid | string].power_drift

    - name: Report what this run changed on the VMs
      ansible.builtin.debug:
        msg: >-
          {{ ct.name }} (VMID {{ ct.vmid }}): set {{ a.to_set | join(', ') or '-' }},
          delete {{ a.to_delete | join(', ') or '-' }},
          power {{ a.status or '(none)' }} -> {{ a.status_expected }}
      vars:
        a: "{{ pve_vm_eval[ct.vmid | string] }}"
      changed_when: false
      loop: "{{ pve_vm_specs }}"
      loop_control: *pve_loop

    - name: Re-read every declared VM through the API
      community.proxmox.proxmox_vm_info:
        <<: *pve_auth
        vmid: "{{ ct.vmid }}"
        type: qemu
        config: current
      loop: "{{ pve_vm_specs }}"
      loop_control: *pve_loop
      register: applied_vms
      no_log: true

    - name: Re-analyse every VM from the fresh API read
      ansible.builtin.set_fact:
        pve_vm_after: "{{ pve_vm_after | default({}) | combine({ (ct.vmid | string): analysis }) }}"
      vars:
        ga: "{{ applied_vms.results[idx].proxmox_vms | first | default({}, true) }}"
        live: "{{ ga.config | default({}, true) }}"
        live_status: "{{ ga.status | default('', true) }}"
        analysis: "{{ pve_analysis }}"
        declared_norm: "{{ pve_vm_declared_norm }}"
        actual_norm: "{{ pve_vm_actual_norm }}"
        pve_undeclared_child_keys: "{{ pve_vm_undeclared_child_keys }}"
        pve_creation_time_drift: "{{ pve_vm_creation_time_drift }}"
      loop: "{{ pve_vm_specs }}"
      loop_control: *pve_loop

    - name: Verify every VM matches the declared state
      ansible.builtin.assert:
        that:
          - b.exists
          - b.mismatched | length == 0
          - b.forbidden_present | length == 0
          - b.creation_time_drift | length == 0
          - not b.power_drift
        fail_msg: >-
          {{ ct.name }} (VMID {{ ct.vmid }}) does not match inventory/group_vars/all.yml after apply:
          mismatched={{ b.declared_subset | to_json }} vs live={{ b.actual_subset | to_json }},
          still present but declared absent={{ b.forbidden_present | join(', ') or '-' }},
          creation-time drift={{ b.creation_time_drift | join(', ') or '-' }},
          status {{ b.status }} vs declared {{ b.status_expected }}.
        success_msg: >-
          Verified {{ ct.name }} (VMID {{ ct.vmid }}): {{ ct.cores }} vCPU x {{ ct.sockets }} socket,
          {{ ct.memory }} MiB RAM, {{ b.status }}, boot {{ ct.boot }}, and every declared setting matches.
      vars:
        b: "{{ pve_vm_after[ct.vmid | string] }}"
      loop: "{{ pve_vm_specs }}"
      loop_control: *pve_loop

    - name: Mark the end of this run in the API journal
      ansible.builtin.lineinfile:
        path: "{{ pve_journal }}"
        line: "{{ run_end | to_json }}"
        create: true
        mode: "0600"
      vars:
        run_end:
          ts: "{{ '%Y-%m-%dT%H:%M:%S%z' | strftime }}"
          event: run_end
          playbook: "{{ ansible_play_name }}"
          verified: "{{ (pve_cts | map(attribute='vmid') | list) + (pve_vm_specs | map(attribute='vmid') | list) }}"
      changed_when: false

    # Observability is only real if it is checked: a trace that quietly stopped
    # working must fail the run, not produce empty logs.
    - name: Fail loudly if this run left no API trace
      ansible.builtin.stat:
        path: "{{ pve_journal }}"
      register: pve_journal_end

    - name: Assert this run was traced to the journal
      ansible.builtin.assert:
        that:
          - pve_journal_end.stat.size | int > pve_journal_start.stat.size | int
        fail_msg: >-
          {{ pve_journal }} did not grow during this run, so its PVE API traffic was NOT traced.
          Check that playbooks/tracing/sitecustomize.py exists and that PYTHONPATH points at it
          (play-level environment), then look for `tracer_error` lines in the journal.
        success_msg: >-
          API trace OK: the journal grew by
          {{ (pve_journal_end.stat.size | int) - (pve_journal_start.stat.size | int) }} bytes.
