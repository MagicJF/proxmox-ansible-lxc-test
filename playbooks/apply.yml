---
- name: Converge the disposable test LXC to the state declared in group_vars/all.yml
  hosts: localhost
  gather_facts: false
  vars:
    pve_auth: &pve_auth
      api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
      api_port: 8006
      api_user: root@pam
      api_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
      api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
      ca_path: "{{ lookup('env', 'PROXMOX_CA_PATH') }}"
      validate_certs: true
      api_timeout: 300
  pre_tasks:
    - name: Refuse an inaccurate dry-run
      ansible.builtin.fail:
        msg: >-
          community.proxmox.proxmox declares supports_check_mode=False, so --check only skips the
          mutating task and predicts nothing. Run playbooks/preflight.yml for the read-only diff.
          No changes were made.
      when: ansible_check_mode

  tasks:
    - name: Read the live container through the API
      community.proxmox.proxmox_vm_info:
        <<: *pve_auth
        vmid: "{{ pve_vmid }}"
        type: lxc
        config: current
      register: live_lxc
      no_log: true

    - name: Record whether the container already exists
      ansible.builtin.set_fact:
        pve_exists: "{{ live_lxc.proxmox_vms | length == 1 }}"

    # Creation-time properties cannot be converged in place. Fail loudly instead of
    # reporting a success the API never applied.
    - name: Refuse to converge properties PVE cannot change on an existing container
      ansible.builtin.assert:
        that:
          - live_lxc.proxmox_vms[0].config.unprivileged | int == (1 if pve_unprivileged | bool else 0)
          - (pve_storage ~ ':') in live_lxc.proxmox_vms[0].config.rootfs
          - live_lxc.proxmox_vms[0].config.rootfs | regex_replace('^.*size=([0-9]+)G$', '\\1') | int == pve_rootfs_size | int
        fail_msg: >-
          group_vars/all.yml declares a creation-time property (unprivileged, rootfs storage or rootfs
          size) that differs from the live container. PVE cannot apply it in place, and growing the
          rootfs is irreversible, so nothing was changed. Recreate the container deliberately
          (state: absent, then apply) or revert that value.
        success_msg: "Creation-time properties match the live container."
      when: pve_exists

    - name: Create the container at the declared state
      community.proxmox.proxmox:
        <<: *pve_auth
        node: "{{ pve_node }}"
        vmid: "{{ pve_vmid }}"
        hostname: "{{ pve_hostname }}"
        ostemplate: "{{ pve_template }}"
        storage: "{{ pve_storage }}"
        disk: "{{ pve_storage }}:{{ pve_rootfs_size }}"
        cores: "{{ pve_cores }}"
        memory: "{{ pve_memory }}"
        swap: "{{ pve_swap }}"
        unprivileged: "{{ pve_unprivileged | bool }}"
        onboot: "{{ pve_onboot | bool }}"
        update: true
        state: present
      register: create_result
      no_log: true
      when: not pve_exists

    # Only in-place-changeable properties are sent here. The module PUTs every
    # parameter it receives, so anything else would be written blindly.
    - name: Converge the in-place resources of the existing container
      community.proxmox.proxmox:
        <<: *pve_auth
        node: "{{ pve_node }}"
        vmid: "{{ pve_vmid }}"
        hostname: "{{ pve_hostname }}"
        cores: "{{ pve_cores }}"
        memory: "{{ pve_memory }}"
        swap: "{{ pve_swap }}"
        onboot: "{{ pve_onboot | bool }}"
        update: true
        state: present
      register: converge_result
      no_log: true
      when: pve_exists

    - name: Re-read the container through the API
      community.proxmox.proxmox_vm_info:
        <<: *pve_auth
        vmid: "{{ pve_vmid }}"
        type: lxc
        config: current
      register: applied_lxc
      no_log: true

    - name: Verify the applied state matches group_vars/all.yml
      ansible.builtin.assert:
        that:
          - applied_lxc.proxmox_vms | length == 1
          - applied_lxc.proxmox_vms[0].vmid | int == pve_vmid
          - applied_lxc.proxmox_vms[0].name == pve_hostname
          - applied_lxc.proxmox_vms[0].status == 'stopped'
          - applied_lxc.proxmox_vms[0].config.hostname == pve_hostname
          - applied_lxc.proxmox_vms[0].config.cores | int == pve_cores | int
          - applied_lxc.proxmox_vms[0].config.memory | int == pve_memory | int
          - applied_lxc.proxmox_vms[0].config.swap | int == pve_swap | int
          - applied_lxc.proxmox_vms[0].config.unprivileged | int == (1 if pve_unprivileged | bool else 0)
          - (pve_storage ~ ':') in applied_lxc.proxmox_vms[0].config.rootfs
        fail_msg: "The API did not return the state declared in group_vars/all.yml."
        success_msg: >-
          Verified {{ pve_hostname }} (VMID {{ pve_vmid }}): {{ pve_cores | int }} vCPU,
          {{ pve_memory | int }} MiB RAM, {{ pve_swap | int }} MiB swap, stopped,
          rootfs on {{ pve_storage }}.
