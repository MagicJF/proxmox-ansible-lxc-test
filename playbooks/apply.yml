---
# ===========================================================================
# apply.yml — the convergent verb.
#
# Why the run is shaped this way (measured on the lab control node):
#   1. ONE process reads every declared guest (tools/pve_read.py). Each Ansible
#      task costs ~3 s of module overhead while a PVE API call costs 15-80 ms,
#      so reading the guests in one task per guest cost ~48 s for ~0.3 s of
#      actual work.
#   2. ONE templating pass analyses all of them (pve_engine.j2 macros), instead
#      of a set_fact loop that cost a module execution per guest.
#   3. Only guests that actually drifted get a mutation task.
#   4. Verification re-reads everything in one process and re-analyses it in one
#      pass: a task exit status is not proof that PVE stored what was declared.
#
# The checks were never the cost — validate/report/assert inside a task are
# free. The number of execution boundaries was. So no check was removed.
# ===========================================================================
- name: Converge every guest declared in inventory/group_vars/all.yml
  hosts: localhost
  gather_facts: false
  vars:
    # Credentials. When playbooks/vars/secrets.yml exists its hardcoded values
    # win (loaded in pre_tasks); otherwise these environment fallbacks apply.
    # The reader tool resolves its own credentials from the same file, so the
    # token never travels through an Ansible argument or task environment.
    pve_api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    pve_api_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
    pve_api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
    pve_api_ca_path: "{{ lookup('env', 'PROXMOX_CA_PATH') }}"
    pve_auth: &pve_auth
      api_host: "{{ pve_api_host }}"
      api_port: 8006
      api_user: root@pam
      api_token_id: "{{ pve_api_token_id }}"
      api_token_secret: "{{ pve_api_token_secret }}"
      ca_path: "{{ pve_api_ca_path }}"
      validate_certs: true
      api_timeout: 300
    pve_loop: &pve_loop
      loop_var: ct
      index_var: idx
      label: "VMID {{ ct.vmid }}"
    # How long the workstations get to hold their declared addresses before a cold
    # start is called failed: thirty probes, ten seconds apart.
    lab_address_retries: 30
    lab_address_delay: 10
    # Observability: every run appends to a human log (ansible.cfg log_path) and
    # to a machine-readable journal of the real PVE API traffic.
    pve_log_dir: "{{ playbook_dir }}/../logs"
    pve_journal: "{{ playbook_dir }}/../logs/pve-api.jsonl"
    pve_tool: "{{ playbook_dir }}/tools/pve_read.py"
    # La ruta absoluta, no relativa: las acciones locales de Ansible corren desde el
    # directorio del playbook, así que una ruta relativa a la raíz del repo se
    # duplica y el fichero no aparece. Ya pasó, y el error decía
    # `playbooks/playbooks/tools/...`.
    pve_routeros_wait: "{{ playbook_dir }}/tools/routeros_wait.py"
    pve_start_batch: "{{ playbook_dir }}/tools/pve_start_batch.py"
    pve_manifest: "{{ playbook_dir }}/../inventory/group_vars/all.yml"
    pve_secrets: "{{ playbook_dir }}/vars/secrets.yml"
    # The API base for the two things no module covers: node networking
    # (pve_bridges) and growing an imported disk.
    pve_api: "https://{{ pve_api_host }}:8006/api2/json"
  # Arming the tracer: PYTHONPATH makes CPython import playbooks/tracing/sitecustomize.py
  # in every module process, which then journals each HTTP call to PVE. The
  # reader tool inherits it too, so its reads land in the journal as well.
  environment:
    PYTHONPATH: "{{ playbook_dir }}/tracing"
    PVE_HTTP_TRACE: "{{ pve_log_dir }}/pve-api.jsonl"
  pre_tasks:
    - name: Look for the local credentials file
      ansible.builtin.stat:
        path: "{{ pve_secrets }}"
      register: pve_secrets_file

    - name: Load the hardcoded local credentials when present (gitignored)
      ansible.builtin.include_vars:
        file: vars/secrets.yml
      when: pve_secrets_file.stat.exists

    - name: Refuse an inaccurate dry-run
      ansible.builtin.fail:
        msg: >-
          community.proxmox.proxmox declares supports_check_mode=False, so --check only skips the
          mutating task and predicts nothing. Run playbooks/preflight.yml for the read-only diff.
          No changes were made.
      when: ansible_check_mode

  tasks:
    - name: Keep logs/ bounded (the policy in the declared state)
      ansible.builtin.include_tasks: tasks/prune_logs.yml

    # ---- read everything, once -------------------------------------------
    - name: Read every declared guest (one process, one task)
      ansible.builtin.command:
        cmd: >-
          python3 {{ pve_tool }}
          --manifest {{ pve_manifest }}
          --secrets {{ pve_secrets }}
          --journal {{ pve_journal }}
          --playbook '{{ ansible_play_name }}'
          --phase read
      register: pve_read_before
      changed_when: false

    - name: Build the effective spec of every guest and keep the live read
      ansible.builtin.set_fact:
        pve_cts: >-
          {% set out = [] %}{% for i in pve_containers %}{% set _ = out.append(pve_defaults | combine(i)) %}{% endfor %}{{ out }}
        pve_vm_specs: >-
          {% set out = [] %}{% for i in pve_vms %}{% set _ = out.append(pve_vm_defaults | combine(pve_chr_defaults if (i.chr | default(false)) else {}) | combine(i)) %}{% endfor %}{{ out }}
        pve_read_meta: "{{ pve_read_before.stdout | from_json }}"
        pve_live_before: "{{ (pve_read_before.stdout | from_json).guests }}"

    # Before anything is analysed or written: the declared state has to make
    # sense as a whole. See playbooks/tasks/validate_state.yml for why a
    # dangling reference is worth a task of its own.
    - name: Refuse a declared state that points at something that does not exist
      ansible.builtin.include_tasks: tasks/validate_state.yml

    # ---- analyse everything, once ----------------------------------------
    - name: Analyse every declared guest in one templating pass
      ansible.builtin.set_fact:
        pve_plan: "{% import 'pve_engine.j2' as e %}{{ e.plan(pve_cts, pve_vm_specs, pve_live_before) | from_json }}"

    - name: What the declared state means for each guest right now
      ansible.builtin.debug:
        msg: >-
          {% for vmid, p in pve_plan.items() %}
          {{ vmid }}: {{ 'IN SYNC' if p.in_sync else 'DRIFT' }}
          {{ '| exists' if p.exists else '| absent (would be created)' }}
          {{ '| set ' ~ (p.to_set | join(',')) if p.to_set | length > 0 else '' }}
          {{ '| delete ' ~ (p.to_delete | join(',')) if p.to_delete | length > 0 else '' }}
          {{ '| mismatch ' ~ (p.mismatched | join(',')) if p.mismatched | length > 0 else '' }}
          {{ '| creation-time ' ~ (p.creation_time_drift | join(',')) if p.exists and p.creation_time_drift | length > 0 else '' }}
          {{ '| power ' ~ p.status ~ ' -> ' ~ p.status_expected if p.power_drift else '' }}
          {% endfor %}
      changed_when: false

    # One assert for the whole plan: the per-guest loops that used to do this
    # were correct but cost a module execution per guest.
    - name: Refuse a plan PVE could not apply
      ansible.builtin.assert:
        that:
          - pve_read_meta.errors | length == 0
          - pve_read_meta.platform.node_online
          - inactive_storages | length == 0
          - missing_templates | length == 0
          - missing_isos | length == 0
          - bad_status | length == 0
          - bad_creation | length == 0
        fail_msg: >-
          {{ bad_status_text }}{{ ' | ' if bad_status | length > 0 else '' }}{{ creation_text }}
          {{ platform_text }}
          {{ ' | read errors: ' ~ (pve_read_meta.errors | to_json) if pve_read_meta.errors | length > 0 else '' }}
        success_msg: "Every declared guest is readable and declarable, and the platform satisfies it."
      vars:
        # LIST vars are single {{ }} expressions on purpose: a multi-line {% %}
        # block renders as concatenated TEXT (a str), so `| length` would count
        # characters and the assert would compare a string with 0. Only a single
        # expression keeps the native list type.
        bad_status: >-
          {{ (pve_cts + pve_vm_specs) | selectattr('status', 'defined') | map(attribute='status')
             | map('string') | reject('in', ['started', 'stopped']) | list }}
        bad_creation: >-
          {{ pve_plan | dict2items | selectattr('value.exists')
             | selectattr('value.creation_time_drift') | map(attribute='key') | list }}
        inactive_storages: >-
          {{ pve_read_meta.platform.storages_active | dict2items | selectattr('value', 'eq', false)
             | map(attribute='key') | list }}
        missing_templates: >-
          {{ pve_read_meta.platform.templates_present | dict2items | selectattr('value', 'eq', false)
             | map(attribute='key') | list }}
        missing_isos: >-
          {{ pve_read_meta.platform.isos_present | dict2items | selectattr('value', 'eq', false)
             | map(attribute='key') | list }}
        # TEXT vars for the message: a str is exactly what fail_msg wants.
        bad_status_text: >-
          {%- set out = [] -%}
          {%- for g in (pve_cts + pve_vm_specs) if (g.status | string) not in ['started', 'stopped'] -%}
          {%- set _ = out.append((g.hostname | default(g.name)) ~ ' (VMID ' ~ g.vmid ~ '): status must be started or stopped, not ' ~ g.status) -%}
          {%- endfor -%}
          {{- out | join('; ') -}}
        creation_text: >-
          {%- set out = [] -%}
          {%- for vmid, p in pve_plan.items() if p.exists and p.creation_time_drift | length > 0 -%}
          {%- set _ = out.append('VMID ' ~ vmid ~ ': ' ~ (p.creation_time_drift | join(', ')) ~ ' cannot be applied in place (creation-time property)') -%}
          {%- endfor -%}
          {{- out | join('; ') -}}
        platform_text: >-
          {%- set out = [] -%}
          {%- if not pve_read_meta.platform.node_online -%}{%- set _ = out.append('node ' ~ pve_node ~ ' is not online') -%}{%- endif -%}
          {%- for k, v in pve_read_meta.platform.storages_active.items() | list if not v -%}{%- set _ = out.append('inactive storage: ' ~ k) -%}{%- endfor -%}
          {%- for k, v in pve_read_meta.platform.templates_present.items() | list if not v -%}{%- set _ = out.append('missing template: ' ~ k) -%}{%- endfor -%}
          {%- for k, v in pve_read_meta.platform.isos_present.items() | list if not v -%}{%- set _ = out.append('missing ISO: ' ~ k) -%}{%- endfor -%}
          {{- out | join('; ') -}}

    # ---- host network, before any guest attaches to it --------------------
    - name: Converge the declared host segments (pve_bridges)
      ansible.builtin.include_tasks: tasks/bridges.yml

    # ---- mutate, only what drifted ---------------------------------------
    - name: Create the containers that do not exist yet
      community.proxmox.proxmox:
        <<: *pve_auth
        node: "{{ pve_node }}"
        vmid: "{{ ct.vmid }}"
        hostname: "{{ ct.hostname }}"
        ostype: "{{ ct.ostype }}"
        ostemplate: "{{ ct.template }}"
        storage: "{{ ct.storage }}"
        disk: "{{ ct.storage }}:{{ ct.rootfs_size }}"
        cores: "{{ ct.cores }}"
        memory: "{{ ct.memory }}"
        swap: "{{ ct.swap }}"
        cpuunits: "{{ ct.cpuunits }}"
        unprivileged: "{{ ct.unprivileged | bool }}"
        onboot: "{{ ct.onboot | bool }}"
        # The key at birth, declared once in pve_defaults and derived from the
        # key file. PVE writes it into /root/.ssh/authorized_keys at creation
        # and the module never forwards it on update.
        pubkey: "{{ ct.pubkey if (ct.pubkey | default('', true) | length > 0) else omit }}"
        cmode: "{{ ct.cmode | default(omit, true) }}"
        timezone: "{{ ct.timezone | default(omit, true) }}"
        description: "{{ ct.description | default(omit, true) }}"
        tags: "{{ ct.tags | default(omit, true) }}"
        features: "{{ ct.features if (ct.features | default([], true)) else omit }}"
        startup: "{{ ct.startup if (ct.startup | default([], true)) else omit }}"
        nameserver: "{{ ct.nameserver | default(omit, true) }}"
        searchdomain: "{{ ct.searchdomain | default(omit, true) }}"
        hookscript: "{{ ct.hookscript | default(omit, true) }}"
        netif: "{{ ct.netif if (ct.netif | default({}, true)) else omit }}"
        mounts: "{{ ct.mounts if (ct.mounts | default({}, true)) else omit }}"
        mount_devices: "{{ ct.mount_devices if (ct.mount_devices | default([], true)) else omit }}"
        timeout: 120
        state: present
      loop: "{{ pve_cts }}"
      loop_control: *pve_loop
      register: create_result
      no_log: true
      when: not (pve_plan[ct.vmid | string].exists)

    # Only the keys that actually drifted are sent: the module PUTs every
    # parameter it receives, not just the ones it found different.
    - name: Converge the settings that drifted on the existing containers
      community.proxmox.proxmox:
        <<: *pve_auth
        node: "{{ pve_node }}"
        vmid: "{{ ct.vmid }}"
        hostname: "{{ ct.hostname }}"
        cores: "{{ ct.cores if 'cores' in a.to_set else omit }}"
        memory: "{{ ct.memory if 'memory' in a.to_set else omit }}"
        swap: "{{ ct.swap if 'swap' in a.to_set else omit }}"
        cpuunits: "{{ ct.cpuunits if 'cpuunits' in a.to_set else omit }}"
        onboot: "{{ (ct.onboot | bool) if 'onboot' in a.to_set else omit }}"
        cmode: "{{ ct.cmode if 'cmode' in a.to_set else omit }}"
        timezone: "{{ ct.timezone if 'timezone' in a.to_set else omit }}"
        description: "{{ ct.description if 'description' in a.to_set else omit }}"
        tags: "{{ ct.tags if 'tags' in a.to_set else omit }}"
        features: "{{ ct.features if 'features' in a.to_set else omit }}"
        # `startup` NO se pasa aquí a propósito: ver la tarea que lo converge justo
        # después del bloque de contenedores.
        nameserver: "{{ ct.nameserver if 'nameserver' in a.to_set else omit }}"
        searchdomain: "{{ ct.searchdomain if 'searchdomain' in a.to_set else omit }}"
        hookscript: "{{ ct.hookscript if 'hookscript' in a.to_set else omit }}"
        netif: >-
          {{ ct.netif if ((ct.netif | default({}, true)).keys() | list | intersect(a.to_set) | length > 0) else omit }}
        mounts: >-
          {{ ct.mounts if ((ct.mounts | default({}, true)).keys() | list | intersect(a.to_set) | length > 0) else omit }}
        delete: "{{ a.to_delete if a.to_delete else omit }}"
        update: true
        state: present
      vars:
        a: "{{ pve_plan[ct.vmid | string] }}"
      loop: "{{ pve_cts }}"
      loop_control: *pve_loop
      register: converge_result
      no_log: true
      when: a.exists and ((a.to_set | length > 0) or (a.to_delete | length > 0))

    - name: Converger el escalón de arranque de los contenedores donde el plan lo ve distinto
      # Este campo se converge aquí y no en el módulo, con una comprobación real
      # detrás y no una opinión: el módulo de contenedores DOCUMENTA `startup` y su
      # código lo une él mismo (`",".join(kwargs.pop("startup"))`, espera una lista),
      # pero aplicado sobre un invitado que ya existe no cambia nada — el plan ve la
      # diferencia, la tarea corre, y el invitado se queda como estaba, con el
      # recuento en `changed=0`. Lo delató la aserción de verificación del final, que
      # es exactamente para lo que está.
      #
      # PVE sí lo acepta por su API (comprobado: `PUT .../lxc/150/config` con
      # `startup=order=3` devuelve 200 y el valor leído de vuelta es `order=3`), así
      # que el campo se empuja desde el plan. La lista se une con comas porque es la
      # forma que espera PVE; una lista declarada vacía manda cadena vacía, que es lo
      # que borra el escalón.
      ansible.builtin.uri:
        url: "{{ pve_api }}/nodes/{{ pve_node }}/lxc/{{ ct.vmid }}/config"
        method: PUT
        body_format: form-urlencoded
        body:
          startup: "{{ ct.startup | default([], true) | join(',') }}"
        headers:
          Authorization: "PVEAPIToken={{ pve_api_token_id }}={{ pve_api_token_secret }}"
        ca_path: "{{ pve_api_ca_path }}"
        validate_certs: true
        status_code: [200]
        timeout: 30
      loop: "{{ pve_cts }}"
      loop_control: *pve_loop
      when:
        - pve_plan[ct.vmid | string].exists
        - "'startup' in pve_plan[ct.vmid | string].to_set"
      changed_when: true

    # ---- energía: un escalón declarado por llamada, y el margen donde importa ---
    # `startall` acepta una lista de vmids y Proxmox la arranca ordenada por
    # `startup: order=N`, sin pasar a un escalón superior hasta terminar el
    # anterior. Con `vms` se limita a los invitados de esta declaración, que es la
    # regla de la casa — uno ausente de la lista no se toca. Comprobado contra el
    # laboratorio: con un vmid inexistente no arranca nada, y con `vms=156` arranca
    # ese y sólo ese.
    #
    # Pero se le pide UN escalón por llamada, en vez de una sola llamada con todo,
    # por dos razones que se midieron:
    #
    #   1. El margen. `up=` lo cuenta Proxmox POR INVITADO, así que un escalón de
    #      siete equipos de red paga la espera siete veces — entre router y router,
    #      donde no hay ninguna dependencia. La dependencia real es ENTRE escalones:
    #      las workstations piden su dirección al arrancar y sus routers tienen que
    #      estar escuchando. Aquí el margen se declara una vez por escalón
    #      (`pve_power_gap_after`) y se espera entre llamadas.
    #   2. La espera. La llamada es asíncrona y devuelve un UPID al instante, así
    #      que hay que esperar a que la tarea termine. Al ir por escalones, se puede
    #      decir en el registro qué escalón va arrancando en cada momento.
    #
    # Lo que Proxmox NO puede dar y sigue siendo nuestro: comprobar que un invitado
    # esté listo de verdad. La puerta de direcciones de más abajo es la que destapó
    # el fallo del arranque en frío.
    - name: Agrupar la energía por el escalón que declara cada invitado
      # En JSON a propósito: un `set_fact` cuyo template lleva un preámbulo
      # `{% set %}` se renderiza como CADENA, y `loop` no acepta nada que no sea una
      # lista de verdad. Ese error ya nos costó una ejecución.
      ansible.builtin.set_fact:
        pve_power_json: >-
          {% set arrancar = [] %}{% set parar = [] %}
          {% for c in pve_cts + pve_vm_specs %}
          {% if pve_plan[c.vmid | string].power_drift %}
          {% if (c.status | default('started')) == 'started' %}
          {% set _ = arrancar.append(c.vmid) %}
          {% else %}
          {% set _ = parar.append(c.vmid) %}
          {% endif %}
          {% endif %}
          {% endfor %}
          {% set sueltos = [] %}
          {% for c in pve_cts + pve_vm_specs %}
          {% if c.vmid in arrancar %}
          {% set o = (c.startup | default([], true) | select('match', '^order=')
                      | map('regex_replace', '^order=', '') | list | first
                      | default('99', true)) | int %}
          {% set direcciones = (((c.config | default({}, true)).routeros | default({}, true)).addresses | default([], true)) %}
          {% set direccion = (direcciones | first | default({}, true)).address | default('') %}
          {% set _ = sueltos.append({'order': o, 'vmid': c.vmid,
                                     'nombre': c.name | default(c.hostname),
                                     'routeros': (direccion.split('/')[0] if direccion else '')}) %}
          {% endif %}
          {% endfor %}
          {% set escalones = [] %}
          {% for o in sueltos | map(attribute='order') | list | unique | sort %}
          {% set suyos = sueltos | selectattr('order', 'equalto', o) | list %}
          {% set _ = escalones.append({
                 'order': o,
                 'vmids': suyos | map(attribute='vmid') | list,
                 'nombres': suyos | map(attribute='nombre') | list,
                 'routeros': suyos | map(attribute='routeros') | select('ne', '') | list,
                 'espera': (pve_power_gap_after.get(o, 0) if not loop.last else 0)}) %}
          {% endfor %}
          {{ {'escalones': escalones, 'parar': parar} | to_json }}

    - name: Leerlos como lista de verdad
      ansible.builtin.set_fact:
        pve_power: "{{ pve_power_json | from_json }}"

    - name: Decir qué invitados cambian de energía en esta ejecución
      ansible.builtin.debug:
        msg: >-
          parar: {{ pve_power.parar | join(', ') if pve_power.parar | length else 'nada' }}
          | arrancar: {{ pve_power.escalones
                         | map(attribute='nombres') | map('join', ', ') | join('  ->  ')
                         if pve_power.escalones | length else 'nada' }}


    # ---- the same for VMs -------------------------------------------------
    - name: Create the VMs that do not exist yet
      community.proxmox.proxmox_kvm:
        <<: *pve_auth
        node: "{{ pve_node }}"
        vmid: "{{ ct.vmid }}"
        name: "{{ ct.name }}"
        cores: "{{ ct.cores }}"
        sockets: "{{ ct.sockets }}"
        memory: "{{ ct.memory }}"
        cpu: "{{ ct.cpu }}"
        ostype: "{{ ct.ostype }}"
        bios: "{{ ct.bios }}"
        machine: "{{ ct.machine }}"
        scsihw: "{{ ct.scsihw }}"
        vga: "{{ ct.vga }}"
        # The VNC console's keymap. It is a property of the VM, not of the
        # guest's OS, so a Spanish keyboard has to be declared here or every
        # console session types the wrong characters.
        keyboard: "{{ ct.keyboard | default(omit, true) }}"
        onboot: "{{ ct.onboot | bool }}"
        boot: "{{ ct.boot }}"
        description: "{{ ct.description | default(omit, true) }}"
        tags: "{{ ct.tags | default(omit, true) }}"
        kvm: true
        net: "{{ ct.net }}"
        # A serial port declared as `socket` is what gives PVE's UI a console
        # that carries CHARACTERS instead of scancodes — the only console that
        # respects a non-US keyboard when the guest's own console layout cannot
        # be changed (RouterOS, for instance).
        serial: "{{ ct.serial | default(omit, true) }}"
        # A disk that comes from a vendor image is rewritten here into the API's
        # creation-time import syntax; its declared size is applied afterwards
        # (tasks/disk_import.yml), because PVE creates the volume at the image's
        # size.
        scsi: "{{ ct.scsi | pve_disk_specs(ct.disk_import | default([])) }}"
        # A VM has no `pubkey`; the key at birth travels through cloud-init: the
        # same key as the containers (single source: pve_ssh_pubkey_path), plus
        # the cloud-init drive and its user. The drive claims ide2, so a guest
        # that declares cloudinit true must not use ide2 for anything else.
        ide: >-
          {{ ((ct.ide | default({}, true)) | combine({'ide2': ct.cloudinit_storage ~ ':cloudinit,format=qcow2'})
              if (ct.cloudinit | bool) else (ct.ide if (ct.ide | default({}, true)) else omit)) }}
        sshkeys: >-
          {{ ct.sshkeys if (ct.cloudinit | bool) and ((ct.sshkeys | default('', true)) | length > 0) else omit }}
        ciuser: "{{ ct.ciuser | default(omit, true) if (ct.cloudinit | bool) else omit }}"
        timeout: 300
        state: present
      loop: "{{ pve_vm_specs }}"
      loop_control: *pve_loop
      register: vm_create
      no_log: true
      when: not (pve_plan[ct.vmid | string].exists)

    - name: Converge the settings that drifted on the existing VMs
      community.proxmox.proxmox_kvm:
        <<: *pve_auth
        node: "{{ pve_node }}"
        vmid: "{{ ct.vmid }}"
        name: "{{ ct.name }}"
        cores: "{{ ct.cores if 'cores' in a.to_set else omit }}"
        sockets: "{{ ct.sockets if 'sockets' in a.to_set else omit }}"
        memory: "{{ ct.memory if 'memory' in a.to_set else omit }}"
        cpu: "{{ ct.cpu if 'cpu' in a.to_set else omit }}"
        vga: "{{ ct.vga if 'vga' in a.to_set else omit }}"
        keyboard: "{{ ct.keyboard if 'keyboard' in a.to_set else omit }}"
        serial: >-
          {{ ct.serial if ((ct.serial | default({}, true)).keys() | list | intersect(a.to_set) | length > 0) else omit }}
        boot: "{{ ct.boot if 'boot' in a.to_set else omit }}"
        onboot: "{{ (ct.onboot | bool) if 'onboot' in a.to_set else omit }}"
        # El orden de arranque viaja igual que en los contenedores. Faltaba aquí, y
        # el hueco era silencioso: el plan SÍ detectaba la diferencia, la tarea se
        # ejecutaba (por eso `to_set` no estaba vacío), pero como el módulo no lo
        # recibía no cambiaba nada y el recuento salía `changed=0`. Los siete
        # routers se quedaron sin `order` y Proxmox arranca los invitados sin orden
        # DESPUÉS de los que lo tienen: las workstations salían antes que sus
        # routers y se quedaban sin dirección.
        # `proxmox_kvm` quiere `startup` como cadena ("order=2,up=45"); el módulo de
        # contenedores une la lista por su cuenta y éste no. Se declara igual en el
        # manifiesto (lista, que es la forma de PVE) y se une aquí.
        startup: "{{ ct.startup | join(',') if 'startup' in a.to_set else omit }}"
        description: "{{ ct.description if 'description' in a.to_set else omit }}"
        tags: "{{ ct.tags if 'tags' in a.to_set else omit }}"
        update: true
        timeout: 300
        state: present
      vars:
        a: "{{ pve_plan[ct.vmid | string] }}"
      loop: "{{ pve_vm_specs }}"
      loop_control: *pve_loop
      register: vm_converge
      no_log: true
      when: a.exists and (a.to_set | length > 0)

    # ---- la energía, ya con todos los invitados creados ------------------------
    # Va después de crear ambos tipos porque la llamada en bloque es de Proxmox y
    # necesita que existan. Y va por escalones precisamente por el orden: es lo que
    # evita que una workstation pida su dirección antes de que su router escuche.
    - name: Subir la energía escalón a escalón, con su margen entre uno y el siguiente
      # El arranque, la espera de su tarea y el margen tienen que ir en el MISMO
      # recorrido. Estaban en tareas distintas con `loop`, y Ansible recorre primero
      # todas las llamadas y sólo después todos los márgenes: pedía los tres
      # escalones seguidos y luego dormía, con las workstations arrancando a la vez
      # que sus routers. Ver `tasks/power.yml`, donde está contado entero.
      ansible.builtin.include_tasks: tasks/power.yml
      loop: "{{ pve_power.escalones }}"
      loop_control:
        loop_var: paso
        label: "order={{ paso.order }}: {{ paso.nombres | join(', ') }}"

    - name: Parar en bloque lo que la declaración quiere parado
      # Aquí SÍ una sola llamada: `stopall` invierte el orden por su cuenta, que es
      # justo lo que se quiere al apagar (primero las estaciones y al final la
      # infraestructura), y al apagar no hay ninguna dirección que reclamar, así que
      # no hay margen que dar.
      #
      # `force-stop` porque `stopall` es amable por defecto: concede 180 s por
      # invitado, NO fuerza, y termina la tarea diciendo `OK` aunque el invitado
      # siga en marcha. Leído del registro de la tarea, no supuesto:
      #
      #     Stopping CT 156 (timeout = 180 seconds)   <- las cinco que no bajaron
      #     ...
      #     Stopping CT 143 (timeout = 180 seconds)
      #     TASK OK                                    <- y seguían en pie
      #
      # El parámetro existe: el esquema de la API acepta `force-stop` y rechaza
      # `force` y `forceStop`. Un laboratorio que se apaga a medias en silencio no
      # vale, y si aun así algo quedara en pie lo caza la verificación del final.
      #
      # Y `timeout` porque `force-stop` NO acorta la cortesía: sigue concediendo los
      # 180 s de fábrica por invitado antes de forzar, y con cuatro invitados a la
      # vez son más de cinco minutos de apagado medidos. 30 s bastan para que un
      # contenedor de este laboratorio se apague solo —y para un CHR, que no tiene
      # servicios que cerrar—, y a partir de ahí se fuerza.
      ansible.builtin.uri:
        url: "{{ pve_api }}/nodes/{{ pve_node }}/stopall"
        method: POST
        body_format: form-urlencoded
        body:
          vms: "{{ pve_power.parar | join(',') }}"
          force-stop: 1
          timeout: 30
        headers:
          Authorization: "PVEAPIToken={{ pve_api_token_id }}={{ pve_api_token_secret }}"
        ca_path: "{{ pve_api_ca_path }}"
        validate_certs: true
        status_code: [200]
        timeout: 120
      register: pve_stopall
      when: pve_power.parar | length > 0
      changed_when: true

    - name: Dar a cada escalón, antes del siguiente, el margen que declara
      # El margen va DESPUÉS de haber pedido el arranque del escalón, no antes: la
      # llamada vuelve al instante, así que los segundos se cuentan desde que sus
      # invitados han empezado a arrancar de verdad. El último escalón no espera a
      # nadie, y eso lo decide el propio cálculo de los escalones.
      ansible.builtin.pause:
        seconds: "{{ item.espera }}"
      when: item.espera | int > 0
      loop: "{{ pve_power.escalones }}"
      loop_control:
        label: "margen tras order={{ item.order }}: {{ item.espera }} s"

    - name: Esperar a que Proxmox termine de parar lo que se paró
      # El arranque ya espera su propia tarea escalón a escalón (ver tasks/power.yml).
      # Aquí queda la del apagado, que sí es una sola llamada. Y el UPID vive en
      # `.json.data`, no en la raíz del resultado del módulo `uri`.
      ansible.builtin.uri:
        url: >-
          {{ pve_api }}/nodes/{{ pve_node }}/tasks/{{
             (pve_stopall.json | default({}, true)).get('data', '') | urlencode }}/status
        headers:
          Authorization: "PVEAPIToken={{ pve_api_token_id }}={{ pve_api_token_secret }}"
        ca_path: "{{ pve_api_ca_path }}"
        validate_certs: true
        return_content: true
        timeout: 30
      register: pve_power_task
      until: (pve_power_task.json.data.status | default('')) != 'running'
      retries: 90
      delay: 5
      when: (pve_stopall.json | default({}, true)).get('data', '') | length > 0

    # ---- and a cold start must not end green with guests off the network ------
    - name: Wait for the workstations to hold their declared addresses
      ansible.builtin.include_tasks: tasks/lab_addresses.yml
      when: (pve_cts | selectattr('site', 'defined') | list | length) > 0

    # ---- imported disks, once the VMs exist ------------------------------
    - name: Grow the imported disk images to their declared size
      ansible.builtin.include_tasks: tasks/disk_import.yml

    # ---- verify from a fresh read, once ----------------------------------
    - name: Re-read every declared guest (one process, one task)
      ansible.builtin.command:
        cmd: >-
          python3 {{ pve_tool }}
          --manifest {{ pve_manifest }}
          --secrets {{ pve_secrets }}
          --journal {{ pve_journal }}
          --playbook '{{ ansible_play_name }}'
          --phase verify
      register: pve_read_after
      changed_when: false

    - name: Re-analyse every guest from the fresh read
      ansible.builtin.set_fact:
        pve_read_meta_after: "{{ pve_read_after.stdout | from_json }}"
        pve_plan_after: >-
          {% import 'pve_engine.j2' as e %}{{ e.plan(pve_cts, pve_vm_specs, (pve_read_after.stdout | from_json).guests) | from_json }}

    - name: Verify every guest matches the declared state
      ansible.builtin.assert:
        that:
          - b.exists
          - b.mismatched | length == 0
          - b.forbidden_present | length == 0
          - b.creation_time_drift | length == 0
          - not b.power_drift
        fail_msg: >-
          VMID {{ vmid }} does not match inventory/group_vars/all.yml after apply:
          mismatched={{ b.declared_subset | to_json }} vs live={{ b.actual_subset | to_json }},
          still present but declared absent={{ b.forbidden_present | join(', ') or '-' }},
          creation-time drift={{ b.creation_time_drift | join(', ') or '-' }},
          status {{ b.status }} vs declared {{ b.status_expected }}.
        success_msg: >-
          VMID {{ vmid }} verified: {{ b.status }}, every declared setting matches
          ({{ b.mismatched | length }} differences).
      vars:
        b: "{{ item.value }}"
        vmid: "{{ item.key }}"
      loop: "{{ pve_plan_after | dict2items }}"
      loop_control:
        label: "VMID {{ item.key }}"

    # Observability is only real if it is checked: a trace that quietly stopped
    # working must fail the run, not produce empty logs.
    - name: Assert this run was traced to the journal
      ansible.builtin.assert:
        that:
          - pve_read_meta_after.journal_size_after | int > pve_read_meta.journal_size_before | int
        fail_msg: >-
          {{ pve_journal }} did not grow during this run, so its PVE API traffic was NOT traced.
          Check that playbooks/tracing/sitecustomize.py exists and that PYTHONPATH points at it
          (play-level environment), then look for `tracer_error` lines in the journal.
        success_msg: >-
          API trace OK: the journal grew by
          {{ (pve_read_meta_after.journal_size_after | int) - (pve_read_meta.journal_size_before | int) }} bytes.
