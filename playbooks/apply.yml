---
- name: Converge the containers declared in inventory/group_vars/all.yml
  hosts: localhost
  gather_facts: false
  vars:
    pve_auth: &pve_auth
      api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
      api_port: 8006
      api_user: root@pam
      api_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
      api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
      ca_path: "{{ lookup('env', 'PROXMOX_CA_PATH') }}"
      validate_certs: true
      api_timeout: 300
  pre_tasks:
    - name: Refuse an inaccurate dry-run
      ansible.builtin.fail:
        msg: >-
          community.proxmox.proxmox declares supports_check_mode=False, so --check only skips the
          mutating task and predicts nothing. Run playbooks/preflight.yml for the read-only diff.
          No changes were made.
      when: ansible_check_mode

  tasks:
    - name: Build the effective spec of every declared container
      ansible.builtin.set_fact:
        pve_cts: "{{ (pve_cts | default([])) + [pve_defaults | combine(item)] }}"
      loop: "{{ pve_containers }}"
      loop_control:
        label: "VMID {{ item.vmid }}"

    - name: Read every declared container through the API
      community.proxmox.proxmox_vm_info:
        <<: *pve_auth
        vmid: "{{ ct.vmid }}"
        type: lxc
        config: current
      loop: "{{ pve_cts }}"
      loop_control: &loop_ct
        loop_var: ct
        index_var: idx
        label: "VMID {{ ct.vmid }}"
      register: live_cts
      no_log: true

    # Creation-time properties cannot be converged in place. Fail loudly for that
    # container rather than reporting a success the API never applied.
    - name: Refuse to converge properties PVE cannot change on an existing container
      ansible.builtin.assert:
        that:
          - live_cts.results[idx].proxmox_vms[0].config.unprivileged | int == (1 if ct.unprivileged | bool else 0)
          - (ct.storage ~ ':') in live_cts.results[idx].proxmox_vms[0].config.rootfs
          - live_cts.results[idx].proxmox_vms[0].config.rootfs | regex_replace('^.*size=([0-9]+)G$', '\\1') | int == ct.rootfs_size | int
        fail_msg: >-
          {{ ct.hostname }} (VMID {{ ct.vmid }}): group_vars/all.yml declares a creation-time property
          (unprivileged, rootfs storage or rootfs size) that differs from the live container. PVE
          cannot apply it in place and growing a rootfs is irreversible, so this container was left
          untouched. Recreate it deliberately or revert the value.
        success_msg: "{{ ct.hostname }} (VMID {{ ct.vmid }}): creation-time properties match the live container."
      loop: "{{ pve_cts }}"
      loop_control: *loop_ct
      when: live_cts.results[idx].proxmox_vms | length == 1

    - name: Create the containers that do not exist yet
      community.proxmox.proxmox:
        <<: *pve_auth
        node: "{{ pve_node }}"
        vmid: "{{ ct.vmid }}"
        hostname: "{{ ct.hostname }}"
        ostemplate: "{{ ct.template }}"
        storage: "{{ ct.storage }}"
        disk: "{{ ct.storage }}:{{ ct.rootfs_size }}"
        cores: "{{ ct.cores }}"
        memory: "{{ ct.memory }}"
        swap: "{{ ct.swap }}"
        unprivileged: "{{ ct.unprivileged | bool }}"
        onboot: "{{ ct.onboot | bool }}"
        update: true
        state: present
      loop: "{{ pve_cts }}"
      loop_control: *loop_ct
      register: create_result
      no_log: true
      when: live_cts.results[idx].proxmox_vms | length == 0

    # Only in-place-changeable properties are sent here. The module PUTs every
    # parameter it receives, so passing disk/ostemplate/unprivileged on an update
    # would write them blindly.
    - name: Converge the in-place resources of the containers that already exist
      community.proxmox.proxmox:
        <<: *pve_auth
        node: "{{ pve_node }}"
        vmid: "{{ ct.vmid }}"
        hostname: "{{ ct.hostname }}"
        cores: "{{ ct.cores }}"
        memory: "{{ ct.memory }}"
        swap: "{{ ct.swap }}"
        onboot: "{{ ct.onboot | bool }}"
        update: true
        state: present
      loop: "{{ pve_cts }}"
      loop_control: *loop_ct
      register: converge_result
      no_log: true
      when: live_cts.results[idx].proxmox_vms | length == 1

    - name: Re-read every declared container through the API
      community.proxmox.proxmox_vm_info:
        <<: *pve_auth
        vmid: "{{ ct.vmid }}"
        type: lxc
        config: current
      loop: "{{ pve_cts }}"
      loop_control: *loop_ct
      register: applied_cts
      no_log: true

    - name: Verify every container matches the declared state
      ansible.builtin.assert:
        that:
          - applied_cts.results[idx].proxmox_vms | length == 1
          - applied_cts.results[idx].proxmox_vms[0].vmid | int == ct.vmid | int
          - applied_cts.results[idx].proxmox_vms[0].name == ct.hostname
          - applied_cts.results[idx].proxmox_vms[0].status == 'stopped'
          - applied_cts.results[idx].proxmox_vms[0].config.hostname == ct.hostname
          - applied_cts.results[idx].proxmox_vms[0].config.cores | int == ct.cores | int
          - applied_cts.results[idx].proxmox_vms[0].config.memory | int == ct.memory | int
          - applied_cts.results[idx].proxmox_vms[0].config.swap | int == ct.swap | int
          - applied_cts.results[idx].proxmox_vms[0].config.unprivileged | int == (1 if ct.unprivileged | bool else 0)
          - (ct.storage ~ ':') in applied_cts.results[idx].proxmox_vms[0].config.rootfs
        fail_msg: "{{ ct.hostname }} (VMID {{ ct.vmid }}): the API did not return the declared state."
        success_msg: >-
          Verified {{ ct.hostname }} (VMID {{ ct.vmid }}): {{ ct.cores | int }} vCPU,
          {{ ct.memory | int }} MiB RAM, {{ ct.swap | int }} MiB swap, stopped, rootfs on {{ ct.storage }}.
      loop: "{{ pve_cts }}"
      loop_control: *loop_ct
