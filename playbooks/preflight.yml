---
- name: Read-only preflight of the containers declared in inventory/group_vars/all.yml
  hosts: localhost
  gather_facts: false
  vars:
    pve_auth: &pve_auth
      api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
      api_port: 8006
      api_user: root@pam
      api_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
      api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
      ca_path: "{{ lookup('env', 'PROXMOX_CA_PATH') }}"
      validate_certs: true
    pve_api: "https://{{ lookup('env', 'PROXMOX_HOST') }}:8006/api2/json"
    pve_token_header: "PVEAPIToken={{ lookup('env', 'PROXMOX_TOKEN_ID') }}={{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
  tasks:
    - name: Build the effective spec of every declared container
      ansible.builtin.set_fact:
        pve_cts: "{{ (pve_cts | default([])) + [pve_defaults | combine(item)] }}"
      loop: "{{ pve_containers }}"
      loop_control:
        label: "VMID {{ item.vmid }}"

    - name: Read the node status through the API
      community.proxmox.proxmox_node_info:
        <<: *pve_auth
      register: pve_nodes
      no_log: true

    - name: Read every declared container through the API
      community.proxmox.proxmox_vm_info:
        <<: *pve_auth
        vmid: "{{ ct.vmid }}"
        type: lxc
        config: current
      loop: "{{ pve_cts }}"
      loop_control: &loop_ct
        loop_var: ct
        index_var: idx
        label: "VMID {{ ct.vmid }}"
      register: live_cts
      no_log: true

    - name: Read the node storage list through the API
      ansible.builtin.uri:
        url: "{{ pve_api }}/nodes/{{ pve_node }}/storage"
        method: GET
        headers:
          Authorization: "{{ pve_token_header }}"
        validate_certs: true
        ca_path: "{{ lookup('env', 'PROXMOX_CA_PATH') }}"
        status_code: 200
        return_content: true
      register: pve_storages
      no_log: true

    - name: Read the available container templates per template storage
      ansible.builtin.uri:
        url: "{{ pve_api }}/nodes/{{ pve_node }}/storage/{{ ct.template_storage }}/content?content=vztmpl"
        method: GET
        headers:
          Authorization: "{{ pve_token_header }}"
        validate_certs: true
        ca_path: "{{ lookup('env', 'PROXMOX_CA_PATH') }}"
        status_code: 200
        return_content: true
      loop: "{{ pve_cts }}"
      loop_control: *loop_ct
      register: pve_templates
      no_log: true

    - name: Assert every container's platform prerequisites are usable
      ansible.builtin.assert:
        that:
          - pve_nodes.proxmox_nodes | selectattr('node', 'equalto', pve_node) | selectattr('status', 'equalto', 'online') | list | length == 1
          - pve_storages.json.data | selectattr('storage', 'equalto', ct.storage) | selectattr('active', 'equalto', 1) | list | length == 1
          - pve_templates.results[idx].json.data | selectattr('volid', 'equalto', ct.template) | list | length == 1
        fail_msg: >-
          {{ ct.hostname }} (VMID {{ ct.vmid }}): the declared node is offline, storage
          {{ ct.storage }} is inactive, or template {{ ct.template }} is missing. No changes were made.
        success_msg: >-
          {{ ct.hostname }} (VMID {{ ct.vmid }}): node {{ pve_node }} online,
          {{ ct.storage }} active, template {{ ct.template }} present.
      loop: "{{ pve_cts }}"
      loop_control: *loop_ct

    - name: Report the drift between every live container and the declared state
      ansible.builtin.debug:
        msg: >-
          {{ ct.hostname }} (VMID {{ ct.vmid }}):
          cores {{ live.cores }}->{{ ct.cores }} |
          memory {{ live.memory }}->{{ ct.memory }} |
          swap {{ live.swap }}->{{ ct.swap }} |
          onboot {{ live.onboot }}->{{ 1 if ct.onboot | bool else 0 }} |
          hostname {{ live.hostname }}->{{ ct.hostname }}
          [{{ 'in sync' if aligned else 'DRIFT -> apply.yml converges it' }}]
      vars:
        live: "{{ live_cts.results[idx].proxmox_vms[0].config }}"
        aligned: >-
          {{ (live.cores | string) == (ct.cores | string)
             and (live.memory | string) == (ct.memory | string)
             and (live.swap | string) == (ct.swap | string)
             and (live.onboot | string) == ((1 if ct.onboot | bool else 0) | string)
             and live.hostname == ct.hostname }}
      changed_when: false
      loop: "{{ pve_cts }}"
      loop_control: *loop_ct
      when: live_cts.results[idx].proxmox_vms | length == 1

    - name: Fail when a declared state needs a property PVE cannot change in place
      ansible.builtin.assert:
        that:
          - live_cts.results[idx].proxmox_vms[0].config.unprivileged | int == (1 if ct.unprivileged | bool else 0)
          - (ct.storage ~ ':') in live_cts.results[idx].proxmox_vms[0].config.rootfs
          - live_cts.results[idx].proxmox_vms[0].config.rootfs | regex_replace('^.*size=([0-9]+)G$', '\\1') | int == ct.rootfs_size | int
        fail_msg: >-
          Blocking drift on {{ ct.hostname }} (VMID {{ ct.vmid }}): group_vars/all.yml declares a
          creation-time property (unprivileged, rootfs storage or rootfs size) that differs from the
          live container and cannot be converged in place, so apply.yml would refuse it. Recreate the
          container deliberately or revert the value.
        success_msg: "{{ ct.hostname }} (VMID {{ ct.vmid }}): creation-time properties match; any remaining drift is in-place changeable."
      loop: "{{ pve_cts }}"
      loop_control: *loop_ct
      when: live_cts.results[idx].proxmox_vms | length == 1

    - name: Report the containers that will be created
      ansible.builtin.debug:
        msg: >-
          {{ ct.hostname }} (VMID {{ ct.vmid }}) does not exist yet; apply.yml will create it with
          {{ ct.cores | int }} vCPU, {{ ct.memory | int }} MiB RAM, {{ ct.swap | int }} MiB swap,
          rootfs {{ ct.rootfs_size }} GiB on {{ ct.storage }}.
      changed_when: false
      loop: "{{ pve_cts }}"
      loop_control: *loop_ct
      when: live_cts.results[idx].proxmox_vms | length == 0
