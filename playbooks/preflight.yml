---
# ===========================================================================
# preflight.yml — the read-only verb. Changes nothing at all.
#
# Same engine as apply.yml (one reader process, one templating pass), so the two
# verbs can never disagree about what "in sync" means. It keeps every check the
# previous version had — node online, storage active, declared template present,
# declared ISO present, blocking creation-time drift — but asks for the platform
# facts inside the ONE reader call instead of spending a task per guest per
# question.
#
# Run it when you suspect drift. apply.yml already reads, applies and verifies
# within a single run, so preflight is not a mandatory step of every change.
# ===========================================================================
- name: Report what would change, changing nothing
  hosts: localhost
  gather_facts: false
  vars:
    pve_api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    pve_api_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
    pve_api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
    pve_api_ca_path: "{{ lookup('env', 'PROXMOX_CA_PATH') }}"
    pve_auth: &pve_auth
      api_host: "{{ pve_api_host }}"
      api_port: 8006
      api_user: root@pam
      api_token_id: "{{ pve_api_token_id }}"
      api_token_secret: "{{ pve_api_token_secret }}"
      ca_path: "{{ pve_api_ca_path }}"
      validate_certs: true
      api_timeout: 300
    pve_log_dir: "{{ playbook_dir }}/../logs"
    pve_journal: "{{ playbook_dir }}/../logs/pve-api.jsonl"
    pve_tool: "{{ playbook_dir }}/tools/pve_read.py"
    pve_manifest: "{{ playbook_dir }}/../inventory/group_vars/all.yml"
    pve_secrets: "{{ playbook_dir }}/vars/secrets.yml"
  environment:
    PYTHONPATH: "{{ playbook_dir }}/tracing"
    PVE_HTTP_TRACE: "{{ pve_log_dir }}/pve-api.jsonl"
  pre_tasks:
    - name: Look for the local credentials file
      ansible.builtin.stat:
        path: "{{ pve_secrets }}"
      register: pve_secrets_file

    - name: Load the hardcoded local credentials when present (gitignored)
      ansible.builtin.include_vars:
        file: vars/secrets.yml
      when: pve_secrets_file.stat.exists

  tasks:
    - name: Keep logs/ bounded (the policy in the declared state)
      ansible.builtin.include_tasks: tasks/prune_logs.yml

    - name: Read every declared guest and the platform facts (one process, one task)
      ansible.builtin.command:
        cmd: >-
          python3 {{ pve_tool }}
          --manifest {{ pve_manifest }}
          --secrets {{ pve_secrets }}
          --journal {{ pve_journal }}
          --playbook '{{ ansible_play_name }}'
          --phase read
      register: pve_read
      changed_when: false

    - name: Build the effective spec of every guest and keep the read
      ansible.builtin.set_fact:
        pve_cts: >-
          {% set out = [] %}{% for i in pve_containers %}{% set _ = out.append(pve_defaults | combine(i)) %}{% endfor %}{{ out }}
        pve_vm_specs: >-
          {% set out = [] %}{% for i in pve_vms %}{% set _ = out.append(pve_vm_defaults | combine(pve_chr_defaults if (i.chr | default(false)) else {}) | combine(i)) %}{% endfor %}{{ out }}
        pve_read_meta: "{{ pve_read.stdout | from_json }}"

    # Same check as apply.yml, and for the same reason: preflight is the verb you
    # run when you suspect something, so it must refuse a declared state that
    # points at something that does not exist rather than report on it.
    - name: Refuse a declared state that points at something that does not exist
      ansible.builtin.include_tasks: tasks/validate_state.yml

    - name: Analyse every declared guest in one templating pass
      ansible.builtin.set_fact:
        pve_plan: "{% import 'pve_engine.j2' as e %}{{ e.plan(pve_cts, pve_vm_specs, pve_read_meta.guests) | from_json }}"

    - name: Every guest and the platform must be readable
      ansible.builtin.assert:
        that:
          - pve_read_meta.errors | length == 0
        fail_msg: "The API read failed for: {{ pve_read_meta.errors | to_json }}. Nothing was changed."
        success_msg: "Read every declared guest and the platform facts successfully."

    # Platform prerequisites. Same checks the previous preflight made, now free:
    # they came back inside the single reader call.
    - name: The platform must satisfy every declared guest
      ansible.builtin.assert:
        that:
          - pve_read_meta.platform.node_online
          - inactive_storages | length == 0
          - missing_templates | length == 0
          - missing_isos | length == 0
        fail_msg: >-
          {{ 'node ' ~ pve_node ~ ' is not online. ' if not pve_read_meta.platform.node_online else '' }}
          {{ 'inactive storage: ' ~ (inactive_storages | join(', ')) ~ '. ' if inactive_storages | length else '' }}
          {{ 'missing template: ' ~ (missing_templates | join(', ')) ~ '. ' if missing_templates | length else '' }}
          {{ 'missing ISO: ' ~ (missing_isos | join(', ')) ~ '.' if missing_isos | length else '' }}
          Nothing was changed.
        success_msg: >-
          Node {{ pve_node }} online; every declared storage, template and ISO is present.
      vars:
        inactive_storages: >-
          {{ pve_read_meta.platform.storages_active | dict2items | selectattr('value', 'eq', false) | map(attribute='key') | list }}
        missing_templates: >-
          {{ pve_read_meta.platform.templates_present | dict2items | rejectattr('value') | map(attribute='key') | list }}
        missing_isos: >-
          {{ pve_read_meta.platform.isos_present | dict2items | rejectattr('value') | map(attribute='key') | list }}

    - name: Report the declared-versus-live state
      ansible.builtin.debug:
        msg: >-
          {{ pve_node }} @ {{ pve_read_meta.revision }}
          | {{ pve_cts | length }} container(s), {{ pve_vm_specs | length }} VM(s)
          | {{ pve_plan | dict2items | selectattr('value.in_sync') | list | length }} in sync
          | {{ pve_plan | dict2items | rejectattr('value.in_sync') | list | length }} with drift
          | journal +{{ (pve_read_meta.journal_size_after | int) - (pve_read_meta.journal_size_before | int) }} bytes

    - name: Report each guest
      ansible.builtin.debug:
        msg: >-
          {{ vmid }}: {{ 'IN SYNC' if p.in_sync else 'DRIFT' }}
          {{ '| exists' if p.exists else '| absent (apply would create it)' }}
          {{ '| would set ' ~ (p.to_set | join(',')) if p.to_set | length > 0 else '' }}
          {{ '| would delete ' ~ (p.to_delete | join(',')) if p.to_delete | length > 0 else '' }}
          {{ '| mismatch ' ~ (p.mismatched | join(',')) if p.mismatched | length > 0 else '' }}
          {{ '| creation-time ' ~ (p.creation_time_drift | join(',')) if p.exists and p.creation_time_drift | length > 0 else '' }}
          {{ '| power ' ~ p.status ~ ' -> ' ~ p.status_expected if p.power_drift else '' }}
      vars:
        vmid: "{{ item.key }}"
        p: "{{ item.value }}"
      loop: "{{ pve_plan | dict2items }}"
      loop_control:
        label: "VMID {{ item.key }}"
      changed_when: false

    - name: Blocking drift a recreate would be needed for
      ansible.builtin.assert:
        that:
          - blocking | length == 0
        fail_msg: >-
          Blocking drift: {{ blocking_text }}. These are creation-time properties PVE cannot change
          in place (rootfs growth is irreversible; proxmox_kvm refuses net/scsi/ide/sata/virtio),
          so apply.yml would refuse them. Recreate the guest deliberately or revert the
          declaration. Nothing was changed.
        success_msg: "No guest needs a recreate."
      vars:
        blocking: >-
          {{ pve_plan | dict2items | selectattr('value.exists')
             | selectattr('value.creation_time_drift') | map(attribute='key') | list }}
        blocking_text: >-
          {%- set out = [] -%}
          {%- for vmid, p in pve_plan.items() if p.exists and p.creation_time_drift | length > 0 -%}
          {%- set _ = out.append('VMID ' ~ vmid ~ ' (' ~ (p.creation_time_drift | join(', ')) ~ ')') -%}
          {%- endfor -%}
          {{- out | join('; ') -}}

    - name: Observability is only real if it is checked
      ansible.builtin.assert:
        that:
          - pve_read_meta.journal_size_after | int > pve_read_meta.journal_size_before | int
        fail_msg: >-
          {{ pve_journal }} did not grow during this read, so the PVE API traffic was NOT traced.
          Check playbooks/tracing/sitecustomize.py and the play-level PYTHONPATH.
        success_msg: "API trace OK: the journal grew during this read."

    # ---- the layer 2 PATH, reported here and never changed here ----------
    # Layer 1 can be perfectly in sync while layer 2 has no route to a single
    # guest; that is worth knowing BEFORE running the configure verb, and this
    # verb stays read-only.
    - name: Read whether the declared tunnel interface exists
      ansible.builtin.command: "ip link show {{ pve_tunnel.name | default('wg-lab') }}"
      register: pf_tunnel_link
      changed_when: false
      failed_when: false
      when: pve_tunnel is defined

    - name: Probe every layer-2 guest on :22
      ansible.builtin.wait_for:
        host: "{{ item }}"
        port: 22
        timeout: 3
      loop: >-
        {{ pve_containers | selectattr('config', 'defined')
           | map(attribute='netif', default={}) | map('pve_declared_ipv4')
           | reject('none') | list }}
      register: pf_path
      # ignore_errors so the per-item `failed` survives: wait_for reports
      # `elapsed` on timeout as well, so it cannot be used as the success key.
      ignore_errors: true

    - name: Report the layer 2 path
      ansible.builtin.debug:
        msg: >-
          Layer 2 path: tunnel {{ pve_tunnel.name | default('(none declared)') }}
          {{ 'up' if (pf_tunnel_link.rc | default(1)) == 0 else 'DOWN' }}
          | {{ pf_answered | length }}/{{ pf_path.results | length }} guest(s) answer on :22
          {{ '-> configure/site.yml will converge the declared tunnel before it needs it'
             if (pf_answered | length == 0 and (pve_tunnel.manage | default(false) | bool))
             else '' }}
      vars:
        pf_answered: >-
          {{ pf_path.results | rejectattr('failed') | map(attribute='item') | list }}
