---
- name: Read-only preflight of every container declared in inventory/group_vars/all.yml
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/state.yml
  vars:
    # Credentials. When playbooks/vars/secrets.yml exists its hardcoded values
    # win (load_vars in pre_tasks); otherwise these environment fallbacks apply.
    pve_api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    pve_api_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
    pve_api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
    pve_api_ca_path: "{{ lookup('env', 'PROXMOX_CA_PATH') }}"
    pve_auth: &pve_auth
      api_host: "{{ pve_api_host }}"
      api_port: 8006
      api_user: root@pam
      api_token_id: "{{ pve_api_token_id }}"
      api_token_secret: "{{ pve_api_token_secret }}"
      ca_path: "{{ pve_api_ca_path }}"
      validate_certs: true
    pve_api: "https://{{ pve_api_host }}:8006/api2/json"
    pve_token_header: "PVEAPIToken={{ pve_api_token_id }}={{ pve_api_token_secret }}"
    pve_log_dir: "{{ playbook_dir }}/../logs"
    pve_journal: "{{ playbook_dir }}/../logs/pve-api.jsonl"
  # Arming the tracer: PYTHONPATH makes CPython import playbooks/tracing/sitecustomize.py
  # in every module process, which then journals each HTTP call to PVE.
  environment:
    PYTHONPATH: "{{ playbook_dir }}/tracing"
    PVE_HTTP_TRACE: "{{ pve_log_dir }}/pve-api.jsonl"
  pre_tasks:
    - name: Look for the local credentials file
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/vars/secrets.yml"
      register: pve_secrets_file

    - name: Load the hardcoded local credentials when present (gitignored)
      ansible.builtin.include_vars:
        file: vars/secrets.yml
      when: pve_secrets_file.stat.exists

    - name: Read the repository revision for the run header
      ansible.builtin.command:
        cmd: git rev-parse --short HEAD
        chdir: "{{ playbook_dir }}/.."
      register: pve_rev
      changed_when: false
      failed_when: false

    - name: Mark the start of this run in the API journal
      ansible.builtin.lineinfile:
        path: "{{ pve_journal }}"
        line: "{{ run_start | to_json }}"
        create: true
        mode: "0600"
      vars:
        run_start:
          ts: "{{ '%Y-%m-%dT%H:%M:%S%z' | strftime }}"
          event: run_start
          playbook: "{{ ansible_play_name }}"
          revision: "{{ pve_rev.stdout | default('unknown', true) }}"
          containers: "{{ pve_containers | map(attribute='vmid') | list }}"
      changed_when: false

    - name: Remember the journal size so this run can prove it was traced
      ansible.builtin.stat:
        path: "{{ pve_journal }}"
      register: pve_journal_start

  tasks:
    - name: Build the effective spec of every declared container
      ansible.builtin.set_fact:
        pve_cts: "{{ (pve_cts | default([])) + [pve_defaults | combine(item)] }}"
      loop: "{{ pve_containers }}"
      loop_control:
        label: "VMID {{ item.vmid }}"

    - name: Read the node status through the API
      community.proxmox.proxmox_node_info:
        <<: *pve_auth
      register: pve_nodes
      no_log: true

    - name: Read every declared container through the API
      community.proxmox.proxmox_vm_info:
        <<: *pve_auth
        vmid: "{{ ct.vmid }}"
        type: lxc
        config: current
      loop: "{{ pve_cts }}"
      loop_control: &loop_ct
        loop_var: ct
        index_var: idx
        label: "VMID {{ ct.vmid }}"
      register: live_cts
      no_log: true

    - name: Read the node storage list through the API
      ansible.builtin.uri:
        url: "{{ pve_api }}/nodes/{{ pve_node }}/storage"
        method: GET
        headers:
          Authorization: "{{ pve_token_header }}"
        validate_certs: true
        ca_path: "{{ pve_api_ca_path }}"
        status_code: 200
        return_content: true
      register: pve_storages
      no_log: true

    - name: Read the available container templates per template storage
      ansible.builtin.uri:
        url: "{{ pve_api }}/nodes/{{ pve_node }}/storage/{{ ct.template_storage }}/content?content=vztmpl"
        method: GET
        headers:
          Authorization: "{{ pve_token_header }}"
        validate_certs: true
        ca_path: "{{ pve_api_ca_path }}"
        status_code: 200
        return_content: true
      loop: "{{ pve_cts }}"
      loop_control: *loop_ct
      register: pve_templates
      no_log: true

    - name: Analyse every declared container against its live state
      ansible.builtin.set_fact:
        pve_eval: "{{ pve_eval | default({}) | combine({ (ct.vmid | string): analysis }) }}"
      vars:
        vm: "{{ live_cts.results[idx].proxmox_vms | first | default({}, true) }}"
        live: "{{ vm.config | default({}, true) }}"
        live_status: "{{ vm.status | default('', true) }}"
        analysis: "{{ pve_analysis }}"
        # feed the shared difference engine with the container mapping
        declared_norm: "{{ pve_lxc_declared_norm }}"
        actual_norm: "{{ pve_lxc_actual_norm }}"
        pve_undeclared_child_keys: "{{ pve_lxc_undeclared_child_keys }}"
        pve_creation_time_drift: "{{ pve_lxc_creation_time_drift }}"
      loop: "{{ pve_cts }}"
      loop_control: *loop_ct

    - name: Assert every container's platform prerequisites are usable
      ansible.builtin.assert:
        that:
          - pve_nodes.proxmox_nodes | selectattr('node', 'equalto', pve_node) | selectattr('status', 'equalto', 'online') | list | length == 1
          - pve_storages.json.data | selectattr('storage', 'equalto', ct.storage) | selectattr('active', 'equalto', 1) | list | length == 1
          - pve_templates.results[idx].json.data | selectattr('volid', 'equalto', ct.template) | list | length == 1
        fail_msg: >-
          {{ ct.hostname }} (VMID {{ ct.vmid }}): the declared node is offline, storage
          {{ ct.storage }} is inactive, or template {{ ct.template }} is missing. No changes were made.
        success_msg: >-
          {{ ct.hostname }} (VMID {{ ct.vmid }}): node {{ pve_node }} online,
          {{ ct.storage }} active, template {{ ct.template }} present.
      loop: "{{ pve_cts }}"
      loop_control: *loop_ct

    - name: Report the declared-versus-live state of every container
      ansible.builtin.debug:
        msg: >-
          {{ ct.hostname }} (VMID {{ ct.vmid }}) [{{ 'IN SYNC' if a.in_sync else 'DRIFT' }}]
          | declared={{ a.declared_subset | to_json }} live={{ a.actual_subset | to_json }}
          | live settings to delete={{ a.to_delete | join(', ') or '-' }}
          | power {{ a.status or '(none)' }} -> {{ a.status_expected }}
          | creation-time drift={{ a.creation_time_drift | join(', ') or '-' }}
      vars:
        a: "{{ pve_eval[ct.vmid | string] }}"
      changed_when: false
      loop: "{{ pve_cts }}"
      loop_control: *loop_ct
      when: a.exists

    - name: Report the containers that do not exist yet
      ansible.builtin.debug:
        msg: >-
          {{ ct.hostname }} (VMID {{ ct.vmid }}) does not exist yet; apply.yml will create it with
          {{ ct.cores }} vCPU, {{ ct.memory }} MiB RAM, {{ ct.swap }} MiB swap, cpuunits {{ ct.cpuunits }},
          reporting {{ ct.status }}, rootfs {{ ct.rootfs_size }} GiB on {{ ct.storage }},
          interfaces {{ (ct.netif | default({}, true)).keys() | join(', ') or '(none)' }},
          mounts {{ (ct.mounts | default({}, true)).keys() | join(', ') or '(none)' }}.
      changed_when: false
      loop: "{{ pve_cts }}"
      loop_control: *loop_ct
      when: not pve_eval[ct.vmid | string].exists

    - name: Fail when a declared state needs a property PVE cannot change in place
      ansible.builtin.assert:
        that:
          - pve_eval[ct.vmid | string].creation_time_drift | length == 0
        fail_msg: >-
          Blocking drift on {{ ct.hostname }} (VMID {{ ct.vmid }}):
          {{ pve_eval[ct.vmid | string].creation_time_drift | join(', ') }} cannot be converged in
          place (and rootfs growth is irreversible), so apply.yml would refuse it. Recreate the
          container deliberately or revert the value.
        success_msg: "{{ ct.hostname }} (VMID {{ ct.vmid }}): creation-time properties match."
      loop: "{{ pve_cts }}"
      loop_control: *loop_ct
      when: pve_eval[ct.vmid | string].exists

    # =======================================================================
    # QEMU VMs (read-only)
    # =======================================================================
    - name: Build the effective spec of every declared VM
      ansible.builtin.set_fact:
        pve_vm_specs: "{{ (pve_vm_specs | default([])) + [pve_vm_defaults | combine(item)] }}"
      loop: "{{ pve_vms }}"
      loop_control:
        label: "VMID {{ item.vmid }}"

    - name: Read the ISO images available for VMs
      ansible.builtin.uri:
        url: "{{ pve_api }}/nodes/{{ pve_node }}/storage/local/content?content=iso"
        method: GET
        headers:
          Authorization: "{{ pve_token_header }}"
        validate_certs: true
        ca_path: "{{ pve_api_ca_path }}"
        status_code: 200
        return_content: true
      register: pve_isos
      no_log: true

    - name: Read every declared VM through the API
      community.proxmox.proxmox_vm_info:
        <<: *pve_auth
        vmid: "{{ ct.vmid }}"
        type: qemu
        config: current
      loop: "{{ pve_vm_specs }}"
      loop_control: *loop_ct
      register: live_vms
      no_log: true

    - name: Analyse every declared VM against its live state
      ansible.builtin.set_fact:
        pve_vm_eval: "{{ pve_vm_eval | default({}) | combine({ (ct.vmid | string): analysis }) }}"
      vars:
        ga: "{{ live_vms.results[idx].proxmox_vms | first | default({}, true) }}"
        live: "{{ ga.config | default({}, true) }}"
        live_status: "{{ ga.status | default('', true) }}"
        analysis: "{{ pve_analysis }}"
        declared_norm: "{{ pve_vm_declared_norm }}"
        actual_norm: "{{ pve_vm_actual_norm }}"
        pve_undeclared_child_keys: "{{ pve_vm_undeclared_child_keys }}"
        pve_creation_time_drift: "{{ pve_vm_creation_time_drift }}"
      loop: "{{ pve_vm_specs }}"
      loop_control: *loop_ct

    - name: Assert every VM's declared ISO images exist on the node
      ansible.builtin.assert:
        that:
          - >-
            ((ct.ide | default({}, true)).values() | map('join', ',')
             | map('regex_findall', '[^:,]+:iso/[^,]+') | flatten | list)
            | difference(pve_isos.json.data | map(attribute='volid') | list) | length == 0
        fail_msg: >-
          {{ ct.name }} (VMID {{ ct.vmid }}): a declared ISO is not present on this node:
          {{ ((ct.ide | default({}, true)).values() | map('join', ',') | map('regex_findall', '[^:,]+:iso/[^,]+')
              | flatten | list) | difference(pve_isos.json.data | map(attribute='volid') | list) | join(', ') }}.
          Nothing was changed.
        success_msg: "{{ ct.name }} (VMID {{ ct.vmid }}): every declared ISO is present on the node."
      loop: "{{ pve_vm_specs }}"
      loop_control: *loop_ct

    - name: Report the declared-versus-live state of every VM
      ansible.builtin.debug:
        msg: >-
          {{ ct.name }} (VMID {{ ct.vmid }}) [{{ 'IN SYNC' if a.in_sync else 'DRIFT' }}]
          | declared={{ a.declared_subset | to_json }} live={{ a.actual_subset | to_json }}
          | live settings to delete={{ a.to_delete | join(', ') or '-' }}
          | power {{ a.status or '(none)' }} -> {{ a.status_expected }}
          | creation-time drift={{ a.creation_time_drift | join(', ') or '-' }}
      vars:
        a: "{{ pve_vm_eval[ct.vmid | string] }}"
      changed_when: false
      loop: "{{ pve_vm_specs }}"
      loop_control: *loop_ct
      when: a.exists

    - name: Report the VMs that do not exist yet
      ansible.builtin.debug:
        msg: >-
          {{ ct.name }} (VMID {{ ct.vmid }}) does not exist yet; apply.yml will create it with
          {{ ct.cores }} vCPU x {{ ct.sockets }} socket, {{ ct.memory }} MiB RAM, {{ ct.bios }}/{{ ct.machine }},
          reporting {{ ct.status }}, boot {{ ct.boot }},
          interfaces {{ (ct.net | default({}, true)).keys() | join(', ') or '(none)' }},
          disks {{ (ct.scsi | default({}, true)).keys() | join(', ') or '(none)' }},
          CD-ROM {{ (ct.ide | default({}, true)).keys() | join(', ') or '(none)' }}.
      changed_when: false
      loop: "{{ pve_vm_specs }}"
      loop_control: *loop_ct
      when: not pve_vm_eval[ct.vmid | string].exists

    - name: Fail when a declared VM needs a property proxmox_kvm cannot change
      ansible.builtin.assert:
        that:
          - pve_vm_eval[ct.vmid | string].creation_time_drift | length == 0
        fail_msg: >-
          Blocking drift on {{ ct.name }} (VMID {{ ct.vmid }}):
          {{ pve_vm_eval[ct.vmid | string].creation_time_drift | join(', ') }} differs and
          proxmox_kvm refuses to update net/scsi/ide/sata/virtio (it can regenerate a MAC or
          recreate a disk) while bios/machine/scsihw/ostype are creation-time. apply.yml would
          refuse it. Recreate the VM deliberately or revert the value.
        success_msg: "{{ ct.name }} (VMID {{ ct.vmid }}): creation-time properties match."
      loop: "{{ pve_vm_specs }}"
      loop_control: *loop_ct
      when: pve_vm_eval[ct.vmid | string].exists

    - name: Mark the end of this run in the API journal
      ansible.builtin.lineinfile:
        path: "{{ pve_journal }}"
        line: "{{ run_end | to_json }}"
        create: true
        mode: "0600"
      vars:
        run_end:
          ts: "{{ '%Y-%m-%dT%H:%M:%S%z' | strftime }}"
          event: run_end
          playbook: "{{ ansible_play_name }}"
      changed_when: false

    # Observability is only real if it is checked: a trace that quietly stopped
    # working must fail the run, not produce empty logs.
    - name: Fail loudly if this run left no API trace
      ansible.builtin.stat:
        path: "{{ pve_journal }}"
      register: pve_journal_end

    - name: Assert this run was traced to the journal
      ansible.builtin.assert:
        that:
          - pve_journal_end.stat.size | int > pve_journal_start.stat.size | int
        fail_msg: >-
          {{ pve_journal }} did not grow during this run, so its PVE API traffic was NOT traced.
          Check that playbooks/tracing/sitecustomize.py exists and that PYTHONPATH points at it
          (play-level environment), then look for `tracer_error` lines in the journal.
        success_msg: >-
          API trace OK: the journal grew by
          {{ (pve_journal_end.stat.size | int) - (pve_journal_start.stat.size | int) }} bytes.
