---
- name: Create the disposable test LXC in Proxmox via its API
  hosts: localhost
  gather_facts: false
  vars:
    pve_node: Proxmox
    pve_vmid: 102
    pve_hostname: test-from-ansible
    pve_template: "local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst"
    pve_storage: local-zfs
  pre_tasks:
    - name: Refuse an inaccurate create dry-run
      ansible.builtin.fail:
        msg: "The community.proxmox.proxmox module does not support check mode. Run playbooks/preflight.yml for the API-backed non-mutating dry-run. No changes were made."
      when: ansible_check_mode
  tasks:
    - name: Ensure LXC test-from-ansible exists
      community.proxmox.proxmox:
        api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
        api_port: 8006
        api_user: root@pam
        api_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
        api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
        ca_path: "{{ lookup('env', 'PROXMOX_CA_PATH') }}"
        validate_certs: true
        api_timeout: 300
        node: "{{ pve_node }}"
        vmid: "{{ pve_vmid }}"
        hostname: "{{ pve_hostname }}"
        ostemplate: "{{ pve_template }}"
        storage: "{{ pve_storage }}"
        disk: "{{ pve_storage }}:8"
        cores: 1
        memory: 1024
        swap: 512
        unprivileged: true
        onboot: false
        state: present
      register: create_result
      no_log: true

    - name: Verify the LXC exists via the Proxmox API
      community.proxmox.proxmox_vm_info:
        api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
        api_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
        api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
        api_user: root@pam
        ca_path: "{{ lookup('env', 'PROXMOX_CA_PATH') }}"
        validate_certs: true
        vmid: "{{ pve_vmid }}"
        type: lxc
        config: current
      register: created_lxc
      no_log: true

    - name: Assert the desired container was created
      ansible.builtin.assert:
        that:
          - created_lxc.proxmox_vms | length == 1
          - created_lxc.proxmox_vms[0].name == pve_hostname
          - created_lxc.proxmox_vms[0].vmid | int == pve_vmid
          - created_lxc.proxmox_vms[0].type == 'lxc'
          - created_lxc.proxmox_vms[0].status == 'stopped'
          - created_lxc.proxmox_vms[0].config.hostname == pve_hostname
          - created_lxc.proxmox_vms[0].config.cores | int == 1
          - created_lxc.proxmox_vms[0].config.memory | int == 1024
          - created_lxc.proxmox_vms[0].config.swap | int == 512
          - created_lxc.proxmox_vms[0].config.unprivileged | int == 1
          - "'local-zfs:' in created_lxc.proxmox_vms[0].config.rootfs"
        fail_msg: "The API did not return the expected LXC identity."
        success_msg: "Verified LXC {{ pve_hostname }} (VMID {{ pve_vmid }}) exists."
