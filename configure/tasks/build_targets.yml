# ---------------------------------------------------------------------------
# Shared by configure/site.yml and configure/audit.yml: turn the declared state
# into an inventory of SSH targets, so the address and the guest identity are
# declared exactly once (in inventory/group_vars/all.yml) and never duplicated
# in a second file.
#
# Runs as a task file inside a play on localhost.
# ---------------------------------------------------------------------------

- name: Look for the local secrets file
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../playbooks/vars/secrets.yml"
  register: l2_secrets

- name: Load the local secrets when present (gitignored)
  ansible.builtin.include_vars:
    file: ../playbooks/vars/secrets.yml
  when: l2_secrets.stat.exists

- name: Assert the automation private key exists
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.fileglob', pve_ssh_key_path) | length > 0
    fail_msg: >-
      No automation key at {{ pve_ssh_key_path }}. Create one with
      `ssh-keygen -t ed25519 -f {{ pve_ssh_key_path }} -N "" -C hermes-ansible-automation`,
      then have layer 1 inject it at birth (pubkey in pve_defaults) or grant it once
      by hand, and point pve_ssh_key_path at it in playbooks/vars/secrets.yml.
    success_msg: "Automation key found at {{ pve_ssh_key_path }}."

# Targets come from three places, and each guest is declared in exactly one:
#   pve_config_targets  guests whose PVE shape layer 1 does NOT manage (partial
#                       adoption, stated explicitly)
#   pve_containers      guests layer 1 creates; any of them may carry a `config:`
#                       block, in which case layer 2 owns the inside
#   pve_vms             same, for VMs. A VM's address lives inside its own OS, so
#                       it cannot be derived from the `net` string: it declares
#                       an explicit `address:` next to its shape.
- name: Build the effective VM specs (the CHR defaults merged, as apply.yml does)
  # The declaration of a router merges pve_chr_defaults over pve_vm_defaults, and
  # `manage: true` lives there — so a target scan that reads the RAW entries sees
  # a router as unmanaged. One extra task is cheaper than a second copy of the
  # merge rule.
  ansible.builtin.set_fact:
    l2_vm_specs: >-
      {% set out = [] %}{% for i in pve_vms %}{% set _ = out.append(pve_vm_defaults | combine(pve_chr_defaults if (i.chr | default(false)) else {}) | combine(i)) %}{% endfor %}{{ out }}

- name: Find the guest that is the layer 2 way into the site LANs
  # A workstation sits on its site's LAN, behind that site's RouterOS router. The
  # control node's tunnel reaches the management network and not those LANs — the
  # note in configure/site.yml says so, and it was measured. The way in is the
  # guest that hands out the first addresses: it is on the management network, and
  # it is the only one that already holds routes into all three sites. Derived from
  # its own declaration rather than repeated here.
  ansible.builtin.set_fact:
    l2_jump: >-
      {% set hits = [] %}{% for c in pve_containers %}{% if ((c.config | default({})).bootstrap | default({})) | length > 0 %}{% set _ = hits.append(c) %}{% endif %}{% endfor %}
      {{ ((hits | first).netif | pve_declared_ipv4) if (hits | length > 0) else '' }}

- name: Assemble the configuration targets from the declared state
  ansible.builtin.set_fact:
    l2_targets: "{{ (l2_targets | default([])) + [entry] }}"
  vars:
    src: "{{ item }}"
    # A router's management address, stripped of its prefix. Empty for anything
    # that is not a router.
    routeros_address: >-
      {{ ((src.config.routeros.addresses | default([]) | selectattr('interface', 'equalto', 'ether1')
           | map(attribute='address') | first | default('', true)) | split('/') | first)
         if (src.config.routeros is defined) else '' }}
    # A container's address comes from its interface declaration; a router has no
    # `netif` (its address lives inside RouterOS). `none` — NOT an empty string —
    # when neither applies, because the caller falls back to an explicit
    # `address:` on `is not none`, and '' is not none.
    derived: >-
      {{ ((src.netif | default({}, true)) | pve_declared_ipv4)
         if (src.netif | default({}, true))
         else (routeros_address if routeros_address | length > 0 else none) }}
    entry:
      vmid: "{{ src.vmid }}"
      hostname: "{{ src.hostname | default(src.name) }}"
      address: "{{ derived if derived is not none else (src.address | default('')) }}"
      manage: "{{ src.manage | default(false) | bool }}"
      config: "{{ src.config | default({}) }}"
      # A guest on one of the site LANs is reached THROUGH the jump (see
      # `l2_jump` above): its declared address is real, but the control node has
      # no route to it — only the management network is reachable directly.
      jump: "{{ l2_jump if src.site is defined else '' }}"
      # A guest that speaks its own API (RouterOS) is not an SSH target: its
      # role runs on the control node and talks to the address directly.
      kind: "{{ 'api' if (src.config.routeros is defined) else 'ssh' }}"
  loop: >-
    {{ (pve_config_targets | default([]))
       + (pve_containers | default([]) | selectattr('config', 'defined') | list)
       + (l2_vm_specs | default([]) | selectattr('config', 'defined') | list) }}
  loop_control:
    label: "{{ item.hostname | default(item.name) }} (VMID {{ item.vmid }})"

- name: Assert every target declares a reachable address
  ansible.builtin.assert:
    that:
      - item.address | length > 0
    fail_msg: >-
      {{ item.hostname }} (VMID {{ item.vmid }}) declares no SSH address. Declare a
      static IPv4 in its net0 (ip=10.10.10.x/24) so it can be derived, or set an
      explicit `address:` on the entry. Layer 2 cannot reach a DHCP-only guest.
    success_msg: "{{ item.hostname }} -> {{ item.address }}"
  loop: "{{ l2_targets }}"
  loop_control:
    label: "{{ item.hostname }}"

- name: Add every SSH target to the inventory
  ansible.builtin.add_host:
    name: "{{ item.hostname }}"
    groups: pve_config_targets
    ansible_host: "{{ item.address }}"
    ansible_user: "{{ pve_ssh_user }}"
    ansible_ssh_private_key_file: "{{ pve_ssh_key_path }}"
    # accept-new is not enough in a lab where a guest is recreated at the same
    # address: its host key changes and the stale entry in known_hosts makes every
    # later run fail with "Host key verification failed". These guests are
    # disposable and live on an internal bridge, so the host key is not the
    # control here — the automation key is.
    ansible_ssh_common_args: >-
      -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      -o ConnectTimeout=10 -o LogLevel=ERROR
    pve_vmid: "{{ item.vmid }}"
    l2_manage: "{{ item.manage }}"
    # The key path is resolved once (secrets file or default) and handed to the
    # guest play as a host var, so it is never re-declared per play.
    l2_ssh_key_path: "{{ pve_ssh_key_path }}"
    l2_config: "{{ item.config }}"
  loop: "{{ l2_targets | selectattr('kind', 'equalto', 'ssh') | list }}"
  loop_control:
    label: "{{ item.hostname }}"
  # inventory bookkeeping, not infrastructure state: keep the changed count
  # meaningful for the guests themselves.
  changed_when: false

# A guest that speaks its own API (RouterOS) is not an SSH target: there is no
# shell to land in, so the role runs HERE and talks to the address directly.
- name: Add every API target to the inventory
  ansible.builtin.add_host:
    name: "{{ item.hostname }}"
    groups: pve_api_targets
    ansible_host: "{{ item.address }}"
    ansible_connection: local
    pve_vmid: "{{ item.vmid }}"
    l2_manage: "{{ item.manage }}"
    l2_config: "{{ item.config }}"
  loop: "{{ l2_targets | selectattr('kind', 'equalto', 'api') | list }}"
  loop_control:
    label: "{{ item.hostname }}"
  changed_when: false

- name: Report the plan
  ansible.builtin.debug:
    msg: >-
      {{ item.hostname }} (VMID {{ item.vmid }}) at {{ item.address }} as {{ pve_ssh_user }}
      -> {{ 'CONVERGED (manage: true)' if item.manage else 'audit only (manage: false)' }}
  loop: "{{ l2_targets }}"
  loop_control:
    label: "{{ item.hostname }}"

# Two declared sources feed the external proof: a Caddy site's own address/body,
# and an explicit `config.http` check list (any service: TiddlyWiki, an app behind
# a proxy, anything that must answer a status and a body from the control node).
- name: Build the external probe list (declared Caddy sites + HTTP checks)
  ansible.builtin.set_fact:
    l2_probes: >-
      {{ (l2_probes | default([]))
         + (item.config.caddy.sites | default([]) | map('combine', {'_target': item.address}) | list)
         + (item.config.http | default([]) | map('combine', {'_target': item.address}) | list) }}
  loop: "{{ l2_targets }}"
  loop_control:
    label: "{{ item.hostname }}"
  # `manage` is templated into a string by set_fact, so selectattr('manage') would
  # treat "False" as truthy. Always go through the bool filter.
  when: item.manage | bool
