---
# ===========================================================================
# routeros — the inside of a MikroTik RouterOS guest.
#
# RouterOS is not a POSIX shell: SSH lands in its own CLI, so the SSH path every
# other guest uses does not apply. It speaks its own API on TCP/8728, and
# configure/tools/routeros_apply.py drives it — the same pattern as
# playbooks/tools/pve_read.py (a small stdlib client instead of a collection
# that would drag librouteros and pip onto the control node).
#
# The play that includes this role runs on the control node, so the tool talks
# to the router's management address directly.
# ===========================================================================
- name: Refuse a RouterOS declaration without an identity or addresses
  ansible.builtin.assert:
    that:
      - l2_config.routeros.identity is defined
      - (l2_config.routeros.addresses | default([])) | length > 0
    fail_msg: >-
      config.routeros needs an `identity` and at least one `addresses` entry
      ({address, interface}). The addresses are what make the router reachable
      at a known place instead of on whatever a DHCP server hands out.
    success_msg: >-
      RouterOS declaration is well formed: identity {{ l2_config.routeros.identity }},
      {{ l2_config.routeros.addresses | length }} address(es).

# The read is also the password probe: a CHR image ships with the factory-empty
# password, so a failed read with a declared password means "set it now", not
# "the router is broken".
- name: Read the router's state with the declared password
  ansible.builtin.command:
    cmd: >-
      python3 {{ routeros_tool }} --host {{ ansible_host }} --user {{ routeros_user }}
      --password={{ routeros_password }} --phase read
  register: routeros_read
  changed_when: false
  failed_when: false
  no_log: true

- name: Converge the declared RouterOS state
  # `--password=` (with the equals sign) on purpose: a factory-empty password
  # renders as an empty string, and `--password ""` would make argparse swallow
  # the NEXT argument as its value.
  ansible.builtin.command:
    cmd: >-
      python3 {{ routeros_tool }} --host {{ ansible_host }} --user {{ routeros_user }}
      --password={{ routeros_password if not routeros_read.failed else '' }}
      {{ ('--new-password=' ~ routeros_password) if (routeros_read.failed and routeros_password | length > 0) else '' }}
      --declared '{{ l2_config.routeros | to_json }}'
  register: routeros_apply
  # The tool prints what it changed; an empty `changed` list means it found the
  # router already in the declared state.
  changed_when: "'\"changed\": []' not in (routeros_apply.stdout | default(''))"
  failed_when: routeros_apply.rc | int != 0
  no_log: true

- name: Report what the router had to change
  ansible.builtin.debug:
    msg: "{{ routeros_apply.stdout | default('') }}"
  changed_when: false

# Verification re-reads the router: a successful API call is not proof that the
# router stored what was declared, so the answer is parsed and compared.
- name: Re-read the router's state
  ansible.builtin.command:
    cmd: >-
      python3 {{ routeros_tool }} --host {{ ansible_host }} --user {{ routeros_user }}
      --password={{ routeros_password }} --phase read
  register: routeros_verify
  changed_when: false
  no_log: true

- name: Assert the router carries the declared identity and addresses
  ansible.builtin.assert:
    that:
      - ros.identity == l2_config.routeros.identity
      - (item.address ~ ' ' ~ item.interface) in ros.addresses
    fail_msg: >-
      The router does not report {{ item.address }} on {{ item.interface }} (or the
      declared identity {{ l2_config.routeros.identity }}). It answered: {{ ros }}.
    success_msg: "{{ item.address }} is on {{ item.interface }} as declared."
  vars:
    ros: "{{ routeros_verify.stdout | from_json }}"
  loop: "{{ l2_config.routeros.addresses }}"
  loop_control:
    label: "{{ item.address }} {{ item.interface }}"

- name: Assert the DHCP client is gone when the declaration says so
  ansible.builtin.assert:
    that:
      - ros.dhcp_clients | length == 0
    fail_msg: >-
      config.routeros declares dhcp_client false but the router still runs one on
      {{ ros.dhcp_clients | join(', ') }}. A DHCP client would add a second,
      unpredictable address to ether1.
    success_msg: "No DHCP client on the router, as declared."
  vars:
    ros: "{{ routeros_verify.stdout | from_json }}"
  when: l2_config.routeros.dhcp_client | default(true) is false
