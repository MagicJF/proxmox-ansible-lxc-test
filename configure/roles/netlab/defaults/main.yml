---
# Declared routes for a guest on an isolated segment.
#
# A guest on its own bridge can only reach the other segment through the router
# VM, and that needs a route the guest's own network configuration does not
# provide (PVE configures the interface and, at most, a default gateway). The
# declaration carries the routes; this role makes them survive a reboot.
#
# Why a systemd unit and not /etc/network/interfaces: PVE configures a
# container's interfaces from the host at start, so the file inside the guest is
# not the authority for its addressing. A unit that runs `ip route replace` is
# idempotent, visible with `systemctl status`, and does not fight PVE.
netlab_routes: []
# Addresses that must answer from inside the guest once the routes are in place.
netlab_peers: []
# The DHCP client's patience, declared per guest: `timeout` is how long dhclient
# keeps trying for an address and `retry` how long it waits between attempts. The
# distro default is 60 seconds, which a guest behind a trunk can miss entirely.
netlab_dhcp: {}
netlab_dhclient_conf: /etc/dhcp/dhclient.conf
# Where the unit lives.
netlab_unit_name: netlab-routes.service
